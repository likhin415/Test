<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Battle Spirits 沙盒</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0a0e14;--panel:#141c28;--panel2:#1e2a3c;--accent:#3b82f6;--text:#e8eef7;--muted:#94a3b8;--cw:9%;--ch:auto;--hw:100px;--hh:140px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
button{cursor:pointer;border:none;border-radius:8px;padding:7px 12px;font-size:13px;background:var(--accent);color:#fff;font-family:inherit;transition:.15s}
button:hover{filter:brightness(1.12)}
button.secondary{background:var(--panel2);color:var(--text);border:1px solid #334155}
button.danger{background:#dc2626}
button:disabled{opacity:.45;cursor:not-allowed}
input,select{background:var(--panel2);border:1px solid #334155;color:var(--text);padding:7px 10px;border-radius:8px;font-size:13px;font-family:inherit}
.nav{display:flex;gap:8px;padding:8px 14px;background:var(--panel);border-bottom:1px solid #1e293b;align-items:center;position:sticky;top:0;z-index:200;flex-wrap:wrap}
.nav h1{font-size:15px;margin-right:auto;font-weight:700}
.nav .tab{background:transparent;color:var(--muted)}
.nav .tab.active{background:var(--accent);color:#fff}
.pill{font-size:11px;padding:3px 8px;border-radius:999px;background:#1e293b;color:var(--muted)}
.pill.ok{color:#4ade80}.pill.err{color:#f87171}.pill.room{color:#60a5fa}
.view{display:none;padding:10px}.view.active{display:block}
.builder-layout{display:grid;grid-template-columns:1fr 340px;gap:12px;max-width:1500px;margin:0 auto}
@media(max-width:960px){.builder-layout{grid-template-columns:1fr}}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;align-items:center}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(115px,1fr));gap:8px}
.card-item{background:var(--panel);border-radius:8px;overflow:hidden;border:1px solid #243044;cursor:pointer;transition:.15s}
.card-item:hover{border-color:var(--accent);transform:translateY(-2px)}
.card-item img{width:100%;aspect-ratio:5/7;object-fit:cover;background:#0f172a;display:block}
.card-item .info{padding:5px 6px;font-size:11px}
.card-item .name{font-weight:600;line-height:1.2;margin-bottom:2px}
.card-item .meta{color:var(--muted);font-size:10px}
.deck-panel{background:var(--panel);border-radius:10px;padding:12px;height:fit-content;position:sticky;top:52px;border:1px solid #243044}
.deck-panel h2{font-size:14px;margin-bottom:8px}
.deck-list{max-height:36vh;overflow-y:auto;margin-bottom:8px}
.deck-entry{display:flex;align-items:center;gap:6px;padding:3px 0;border-bottom:1px solid #1e293b;font-size:12px}
.deck-entry img{width:28px;height:40px;object-fit:cover;border-radius:3px;flex-shrink:0}
.deck-entry .qty{background:var(--accent);min-width:18px;text-align:center;border-radius:4px;font-size:11px}
.deck-actions{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.preset-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:8px}
.preset-grid button{font-size:11px;padding:6px 8px;text-align:left;line-height:1.3}
.play-wrap{max-width:1300px;margin:0 auto}
.room-panel{background:var(--panel);border:1px solid #243044;border-radius:10px;padding:10px;margin-bottom:8px}
.room-panel input{width:110px}
.play-toolbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px;align-items:center}
.play-toolbar .hint{font-size:10px;color:var(--muted);margin-left:auto;max-width:420px;text-align:right;line-height:1.3}
.seat{margin-bottom:4px}
.seat-label{font-size:11px;color:var(--muted);margin-bottom:2px;display:flex;justify-content:space-between}
.board-outer{position:relative;width:100%;border-radius:8px;overflow:hidden;border:2px solid #334155;background:#000}
.board{position:relative;width:100%;aspect-ratio:1100/782;background:#0a0a0a center/100% 100% no-repeat;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.seat.opp .board{transform:rotate(180deg)}
.zone-hit{position:absolute}
#zh-field{left:18%;top:8%;width:58%;height:52%}
#zh-life{left:2.5%;top:42%;width:14%;height:18%}
#zh-reserve{left:2.5%;top:62%;width:14%;height:16%}
#zh-deck{left:80%;top:6%;width:16%;height:28%}
#zh-trash{left:80%;top:42%;width:16%;height:36%}
#zh-void{left:2.5%;top:8%;width:14%;height:28%}
.piece{position:absolute;cursor:grab;z-index:20;touch-action:none;user-select:none;-webkit-user-select:none;outline:none;-webkit-tap-highlight-color:transparent}
.piece.core{z-index:100000}
.piece.card{z-index:20}
.piece.core.selected{outline:2px solid #60a5fa;outline-offset:2px;border-radius:50%}
.piece.dragging{cursor:grabbing;z-index:90;opacity:.92}
.piece.card{width:13.5%;aspect-ratio:5/7;height:auto}
.piece.card img{width:100%;height:100%;object-fit:cover;border-radius:4px;box-shadow:0 3px 10px rgba(0,0,0,.55);pointer-events:none;display:block;user-select:none;-webkit-user-drag:none}
.piece.card{transform-origin:center center}
.piece.card.fatigue-1,.piece.card.exhausted{transform:rotate(90deg)}

.piece.core{width:2.2%;aspect-ratio:1;height:auto;min-width:14px;min-height:14px;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.piece.core.blue{background:radial-gradient(circle at 32% 28%,#93c5fd,#1d4ed8 70%)}
.piece.core.red{background:radial-gradient(circle at 32% 28%,#fca5a5,#b91c1c 70%);border:2px solid #fbbf24}
.deck-stack{position:absolute;width:9%;aspect-ratio:5/7;height:auto;background:linear-gradient(145deg,#1e293b,#0f172a);border:2px solid #64748b;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:clamp(11px,1.5vw,18px);font-weight:700;color:#cbd5e1;cursor:pointer;user-select:none;box-shadow:0 3px 10px rgba(0,0,0,.4)}
.deck-stack::after{content:"牌組";position:absolute;bottom:5px;font-size:10px;font-weight:500;color:#94a3b8}
.hand-bar{position:relative;height:145px;margin-top:2px;background:linear-gradient(180deg,transparent,rgba(15,23,42,.92) 20%);border-radius:0 0 10px 10px}
.hand-label{position:absolute;top:2px;left:8px;font-size:10px;color:var(--muted);z-index:1}
.hand-count{position:absolute;top:2px;right:8px;font-size:11px;color:var(--muted)}
.hand-area{position:absolute;left:0;right:0;bottom:0;height:138px;pointer-events:none}
.hand-drop{position:absolute;inset:0;border:2px dashed transparent;border-radius:8px;pointer-events:none;z-index:5}
.hand-drop.active{border-color:rgba(96,165,250,.7);background:rgba(59,130,246,.12)}
.hand-card{position:absolute;width:min(100px,12vw);aspect-ratio:5/7;height:auto;bottom:4px;transform-origin:bottom center;transition:transform .15s,bottom .15s;cursor:pointer;pointer-events:auto;border-radius:5px;box-shadow:0 5px 14px rgba(0,0,0,.5);user-select:none;-webkit-user-select:none;outline:none}
.hand-card img{width:100%;height:100%;object-fit:cover;border-radius:5px;pointer-events:none;display:block;user-select:none;-webkit-user-drag:none}
.hand-card:hover{bottom:18px!important;z-index:50!important;transform:scale(1.07)!important}
.hand-card.back{filter:brightness(.15);pointer-events:none;width:48px;height:68px}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:300;align-items:center;justify-content:center}
.modal-bg.show{display:flex}
.modal-content{max-width:92vw;max-height:92vh;background:var(--panel);border-radius:12px;padding:14px;position:relative;border:1px solid #334155}
.modal-content img{max-width:min(360px,85vw);max-height:65vh;border-radius:8px;display:block;margin:0 auto}
.modal-content .close{position:absolute;top:4px;right:8px;font-size:24px;background:transparent;color:#fff;padding:0 8px}
.modal-meta{margin-top:8px;font-size:13px;font-weight:600;text-align:center}
.modal-effect{max-width:360px;margin:6px auto 0;font-size:12px;line-height:1.5;white-space:pre-wrap;color:var(--muted);max-height:140px;overflow-y:auto}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--panel2);padding:9px 16px;border-radius:8px;border:1px solid #475569;z-index:400;opacity:0;transition:.25s;pointer-events:none;font-size:13px}
.toast.show{opacity:1}
.loading-overlay{position:fixed;inset:0;background:rgba(10,14,20,.88);z-index:500;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px}
.loading-overlay.hidden{display:none}
.spinner{width:34px;height:34px;border:3px solid #334155;border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.hand-row{display:flex;flex-direction:row;flex-wrap:nowrap;align-items:stretch;gap:8px;margin-top:4px;width:100%}
.hand-actions{
  display:flex;flex-direction:column;justify-content:stretch;align-items:stretch;
  gap:4px;flex:0 0 72px;padding:0;height:145px;box-sizing:border-box;
}
.hand-actions button{
  flex:1 1 0;min-width:0;width:100%;font-size:12px;padding:0 6px;
  white-space:nowrap;box-sizing:border-box;
}
.hand-row .hand-bar{flex:1 1 auto;min-width:0;margin-top:0}


.play-main{display:grid;grid-template-columns:1fr 260px;gap:12px;align-items:start}
@media(max-width:900px){.play-main{grid-template-columns:1fr}}
.tracker{
  background:var(--panel);border:1px solid #243044;border-radius:10px;
  padding:12px;position:sticky;top:56px;max-height:calc(100vh - 80px);overflow-y:auto;
}
.tracker h3{font-size:14px;margin-bottom:10px;color:var(--muted);font-weight:600}
.tracker-item{
  display:flex;align-items:center;gap:8px;padding:6px 0;
  border-bottom:1px solid #1e293b;font-size:12px;cursor:context-menu;
}
.tracker-item img{width:44px;height:62px;object-fit:cover;border-radius:4px;flex-shrink:0;background:#0f172a}
.tracker-item .tname{flex:1;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tracker-item .tqty{
  background:#1e293b;min-width:26px;text-align:center;border-radius:4px;
  font-size:14px;font-weight:700;padding:3px 6px;
}
.tracker-item .tqty.zero{opacity:.35;color:var(--muted)}
.tracker-empty{font-size:11px;color:var(--muted);padding:8px 0}


.sel-box{position:absolute;border:1px solid #60a5fa;background:rgba(59,130,246,.15);pointer-events:none;z-index:100;display:none}

</style>
</head>
<body>
<div class="loading-overlay" id="loadingOverlay"><div class="spinner"></div><div id="loadingText">正在載入卡表…</div></div>
<nav class="nav">
  <h1>⚔️ Battle Spirits 沙盒</h1>
  <button class="tab active" data-view="builder">組建牌組</button>
  <button class="tab" data-view="play">沙盒遊玩</button>
  <span class="pill" id="cardStatus">卡表載入中</span>
  <span class="pill room" id="roomStatus" style="display:none"></span>
</nav>

<div id="view-builder" class="view active">
  <div class="builder-layout">
    <div>
      <div class="filters">
        <input type="text" id="searchInput" placeholder="搜尋卡名 / 卡號…" style="min-width:150px">
        <select id="colorFilter"><option value="">全部顏色</option><option value="紅">紅</option><option value="紫">紫</option><option value="綠">綠</option><option value="白">白</option><option value="黃">黃</option><option value="藍">藍</option></select>
        <select id="typeFilter"><option value="">全部類型</option><option value="戰魂">戰魂</option><option value="核心">核心</option><option value="魔法">魔法</option><option value="勇武">勇武</option></select>
        <select id="setFilter"><option value="">全部系列</option></select>
        <button class="secondary" id="btnClearFilter">清除</button>
        <span id="resultCount" style="font-size:11px;color:var(--muted)"></span>
      </div>
      <div class="card-grid" id="cardGrid"></div>
    </div>
    <div class="deck-panel">
      <h2>我的牌組 <span id="deckCount">(0)</span></h2>
      <div class="deck-list" id="deckList"></div>
      <div class="deck-actions">
        <button id="btnStartPlay">用此牌組遊玩</button>
        <button class="secondary" id="btnExport">匯出</button>
        <button class="secondary" id="btnImport">匯入</button>
        <button class="danger" id="btnClearDeck">清空</button>
        <input type="file" id="importFile" accept=".json" style="display:none">
      </div>
      <div style="font-size:12px;margin-top:6px;color:var(--muted)">預組牌組（點一下載入）</div>
      <div class="preset-grid" id="presetGrid"></div>
    </div>
  </div>
</div>

<div id="view-play" class="view">
  <div class="play-wrap">
    <div class="room-panel">
      <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:4px">
        <span style="font-size:12px;color:var(--muted)">線上房間：</span>
        <button id="btnCreateRoom">建立房間</button>
        <input id="roomCodeInput" placeholder="房間代碼" maxlength="8">
        <button class="secondary" id="btnJoinRoom">加入</button>
        <button class="secondary" id="btnLeaveRoom">離開</button>
        <span id="wsDot" style="width:8px;height:8px;border-radius:50%;background:#64748b;display:inline-block"></span>
        <span id="roomInfo" style="font-size:12px;color:var(--muted)"></span>
      </div>
      
    </div>
    

    <div class="play-main">
    <div class="play-boards">
    <div class="seat opp" id="seatOpp">
      <div class="seat-label"><span>對手</span><span id="oppMeta">未連線 · 手牌 ? · 牌組 ?</span></div>
      <div class="hand-bar" style="height:70px;margin-bottom:2px">
        <span class="hand-label">對手手牌（隱藏）</span>
        <div class="hand-area" id="handAreaOpp" style="height:64px"></div>
      </div>
      <div class="board-outer"><div class="board" id="boardOpp"></div></div>
    </div>

    <div class="seat self" id="seatSelf">
      <div class="seat-label"><span>自己</span><span id="selfMeta">手牌 0 · 牌組 0</span></div>
      <div class="board-outer">
        <div class="board" id="boardSelf">
          <div class="zone-hit" id="zh-field"></div>
          <div class="zone-hit" id="zh-life"></div>
          <div class="zone-hit" id="zh-reserve"></div>
          <div class="zone-hit" id="zh-deck"></div>
          <div class="zone-hit" id="zh-trash"></div>
          <div class="zone-hit" id="zh-void"></div>
          <div class="sel-box" id="selBox"></div>
        </div>
      </div>
      <div class="hand-row">
        <div class="hand-actions">
          <button id="btnNewGame">重開</button>
          <button class="secondary" id="btnAddBlueCore">+Core</button>
          <button class="secondary" id="btnShuffleDeck">洗牌</button>
          <button class="secondary" id="btnCoinFlip">擲硬幣</button>
        </div>
        <div class="hand-bar" id="handBarSelf">
          <span class="hand-label">手牌（僅自己可見）</span>
          <span class="hand-count" id="handCount">0 張</span>
          <div class="hand-drop" id="handDrop"></div>
          <div class="hand-area" id="handArea"></div>
        </div>
      </div>
    </div>
    </div><!-- play-boards -->

    <aside class="tracker" id="trackerPanel">
      <h3>記牌器 · 牌組剩餘</h3>
      <div id="trackerList"><div class="tracker-empty">開始遊戲後顯示</div></div>
    </aside>
    </div><!-- play-main -->
  </div>
</div>

<div class="modal-bg" id="zoomModal">
  <div class="modal-content">
    <button class="close" id="closeZoom">×</button>
    <img id="zoomImg" src="" alt="">
    <div class="modal-meta" id="zoomMeta"></div>
    <div class="modal-effect" id="zoomEffect"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

function toast(m,ms){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._tid);t._tid=setTimeout(()=>t.classList.remove('show'),ms||2200);}

function deckTotal(){return Object.values(deck).reduce((a,b)=>a+b,0);}
function ph(n){return 'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="200" height="280"><rect fill="#1e293b" width="200" height="280"/><text x="100" y="140" fill="#94a3b8" text-anchor="middle" font-size="12">'+(n||'?').slice(0,12)+'</text></svg>');}

async function loadCards(){
  const st=document.getElementById('cardStatus');
  try{
    const res=await fetch(SUPABASE_URL+'/rest/v1/cards?select=id,card_name,card_number,set_code,color,type,cost,rarity,image_url,effect,system,suffix&order=set_code.asc,card_number.asc&limit=2000',{headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY}});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data=await res.json();
    ALL_CARDS=data.map(c=>({id:c.id,name:c.card_name||'未知',number:c.card_number||'',set:c.set_code||'',color:c.color||'',type:c.type||'',cost:c.cost!=null?c.cost:0,rarity:c.rarity||'',image:c.image_url||'',effect:c.effect||'',system:c.system||''}));
    cardById=new Map(ALL_CARDS.map(c=>[c.id,c]));
    const sets=[...new Set(ALL_CARDS.map(c=>c.set).filter(Boolean))].sort();
    const sel=document.getElementById('setFilter');
    sets.forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent=s;sel.appendChild(o);});
    st.textContent='卡表 '+ALL_CARDS.length+' 張';st.classList.add('ok');
    document.getElementById('loadingOverlay').classList.add('hidden');
    renderCardGrid();renderDeckList();buildPresets();
  }catch(e){st.textContent='卡表失敗';st.classList.add('err');document.getElementById('loadingText').textContent=String(e);toast('卡表載入失敗');}
}

function buildPresets(){
  const g=document.getElementById('presetGrid');g.innerHTML='';
  Object.keys(PRESETS).forEach(name=>{
    const b=document.createElement('button');b.className='secondary';b.textContent=name;
    b.onclick=()=>{deck=Object.assign({},PRESETS[name]);saveDeck();toast('已載入：'+name);};
    g.appendChild(b);
  });
}

function renderCardGrid(){
  const q=document.getElementById('searchInput').value.trim().toLowerCase();
  const color=document.getElementById('colorFilter').value;
  const type=document.getElementById('typeFilter').value;
  const set=document.getElementById('setFilter').value;
  const grid=document.getElementById('cardGrid');grid.innerHTML='';
  const filtered=ALL_CARDS.filter(c=>{
    if(q&&!(c.name.toLowerCase().includes(q)||c.number.toLowerCase().includes(q)||(c.system||'').toLowerCase().includes(q)))return false;
    if(color&&!c.color.includes(color))return false;
    if(type&&!c.type.includes(type))return false;
    if(set&&c.set!==set)return false;
    return true;
  });
  let label='顯示 '+filtered.length+' 張';
  const show=filtered.slice(0,200);
  if(filtered.length>200)label+='（前200）';
  document.getElementById('resultCount').textContent=label;
  const frag=document.createDocumentFragment();
  show.forEach(c=>{
    const el=document.createElement('div');el.className='card-item';
    el.innerHTML='<img src="'+(c.image||ph(c.name))+'" loading="lazy" onerror="this.src=\''+ph(c.name)+'\'"><div class="info"><div class="name">'+c.name+'</div><div class="meta">'+c.number+' · '+c.color+' · 費'+c.cost+'</div></div>';
    el.onclick=()=>addToDeck(c.id);
    el.oncontextmenu=e=>{e.preventDefault();showZoom(c);};
    frag.appendChild(el);
  });
  grid.appendChild(frag);
}
function addToDeck(id){const q=deck[id]||0;if(q>=3){toast('最多3張');return;}deck[id]=q+1;saveDeck();}
function removeFromDeck(id){if(!deck[id])return;deck[id]--;if(deck[id]<=0)delete deck[id];saveDeck();}

const board=document.getElementById('boardSelf');

boardOpp.style.backgroundImage='url('+BG_URI+')';

function pct(b,x,y){return{x:(x/100)*b.clientWidth,y:(y/100)*b.clientHeight};}
function setPosPct(el,b,leftPx,topPx){
  const w=b.clientWidth||1, h=b.clientHeight||1;
  el.dataset.px=String((leftPx/w)*100);
  el.dataset.py=String((topPx/h)*100);
  el.style.left=((leftPx/w)*100)+'%';
  el.style.top=((topPx/h)*100)+'%';
}
function applyPosPct(el){
  if(el.dataset.px!=null) el.style.left=el.dataset.px+'%';
  if(el.dataset.py!=null) el.style.top=el.dataset.py+'%';
}
function readPosPct(el,b){
  // return pixel from %
  const w=b.clientWidth||1, h=b.clientHeight||1;
  if(el.dataset.px!=null) return {x:parseFloat(el.dataset.px)/100*w, y:parseFloat(el.dataset.py)/100*h};
  return {x:parseFloat(el.style.left)||0, y:parseFloat(el.style.top)||0};
}
let cardZ = 50;
let coreZ = 100000;
function bumpZ(el){
  if(el && el.dataset && el.dataset.type==='core'){
    coreZ++;
    el.style.zIndex = String(coreZ);
  } else {
    cardZ++;
    // never let cards reach core layer
    if(cardZ >= 99999) cardZ = 50;
    el.style.zIndex = String(cardZ);
  }
}
function raiseAllCores(){
  board.querySelectorAll('.piece.core').forEach(c=>bumpZ(c));
}



function startNewGame(){
  board.querySelectorAll('.piece,.deck-stack').forEach(el=>el.remove());
  document.getElementById('handArea').innerHTML='';
  me={deckCards:[],hand:[],field:[],trash:[]};pieceSeq=1;
  const list=[];
  Object.entries(deck).forEach(([id,qty])=>{
    const c=cardById.get(id);if(!c)return;
    for(let i=0;i<qty;i++) list.push(Object.assign({},c,{uid:id+'_'+i+'_'+Math.random().toString(36).slice(2,7)}));
  });
  for(let i=list.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=list[i];list[i]=list[j];list[j]=t;}
  me.deckCards=list;
  // Official setup: Life 5 blue, Reserve 3 blue + 1 red (shifted down)
  const life=pct(board,5,57);
  for(let i=0;i<5;i++) createCore(board,'blue',life.x+(i%3)*24,life.y+Math.floor(i/3)*24);
  const res=pct(board,5,79);
  for(let i=0;i<3;i++) createCore(board,'blue',res.x+i*24,res.y);
  createCore(board,'red',res.x+36,res.y+28);
  renderDeckStack();
  for(let i=0;i<4&&me.deckCards.length;i++) drawToHand(false);
  renderHand();updateMeta();renderTracker();broadcastState();
  toast('新遊戲：Life 5藍 · Reserve 3藍+1紅 · 手牌4');
}

function updateMeta(){
  document.getElementById('selfMeta').textContent='手牌 '+me.hand.length+' · 牌組 '+me.deckCards.length;
  document.getElementById('handCount').textContent=me.hand.length+' 張';
}

function renderDeckStack(){
  board.querySelectorAll('.deck-stack').forEach(el=>el.remove());
  const pos=pct(board,83,12);
  const stack=document.createElement('div');
  stack.className='deck-stack';stack.textContent=me.deckCards.length;
  setPosPct(stack, board, pos.x, pos.y);
  stack.onclick=e=>{e.stopPropagation();drawToHand(true);};
  stack.oncontextmenu=e=>{e.preventDefault();e.stopPropagation();
    if(!me.deckCards.length){toast('牌組空');return;}
    const card=me.deckCards.shift();me.field.push(card);
    const f=pct(board,25+(me.field.length%6)*8,18+Math.floor((me.field.length%12)/6)*15);
    createCardPiece(board,card,f.x,f.y);
    renderDeckStack();updateMeta();renderTracker();broadcastState();toast('翻開：'+card.name);
  };
  board.appendChild(stack);
}

function drawToHand(show){
  if(!me.deckCards.length){toast('牌組空');return;}
  const card=me.deckCards.shift();me.hand.push(card);
  renderDeckStack();renderHand();updateMeta();renderTracker();broadcastState();
  if(show!==false) toast('抽到手牌：'+card.name);
}

function renderHand(){
  const area=document.getElementById('handArea');area.innerHTML='';
  const n=me.hand.length;updateMeta();
  if(!n)return;
  const maxSpread=Math.min(64,480/Math.max(n,1));
  const totalW=(n-1)*maxSpread,startX=-totalW/2;
  me.hand.forEach((card,i)=>{
    const el=document.createElement('div');el.className='hand-card';el.dataset.uid=card.uid;
    const offset=startX+i*maxSpread,rot=(i-(n-1)/2)*3;
    el.style.left='calc(50% + '+offset+'px - 48px)';
    el.style.transform='rotate('+rot+'deg)';el.style.zIndex=String(10+i);
    el.innerHTML='<img src="'+(card.image||ph(card.name))+'" onerror="this.src=\''+ph(card.name)+'\'">';
    el.onclick=e=>{e.stopPropagation(); if(!el._handDragged) playFromHand(card.uid);};
    el.oncontextmenu=e=>{e.preventDefault();showZoom(card);};
    // drag from hand to field
    el.addEventListener('mousedown', e=>{
      if(e.button!==0) return;
      e.stopPropagation();
      let dragging=false, sx=e.clientX, sy=e.clientY;
      el._handDragged=false;
      const ghost=el.cloneNode(true);
      ghost.style.position='fixed';
      ghost.style.pointerEvents='none';
      ghost.style.zIndex='9999';
      ghost.style.opacity='0.85';
      ghost.style.transform='none';
      ghost.style.margin='0';
      ghost.style.left=e.clientX-40+'px';
      ghost.style.top=e.clientY-60+'px';
      ghost.style.width=el.offsetWidth+'px';
      ghost.style.height=el.offsetHeight+'px';
      const onMove=ev=>{
        if(!dragging){
          if(Math.abs(ev.clientX-sx)>6||Math.abs(ev.clientY-sy)>6){
            dragging=true; el._handDragged=true;
            document.body.appendChild(ghost);
            el.style.opacity='0.35';
          }
          return;
        }
        ghost.style.left=ev.clientX-40+'px';
        ghost.style.top=ev.clientY-60+'px';
      };
      const onUp=ev=>{
        document.removeEventListener('mousemove',onMove);
        document.removeEventListener('mouseup',onUp);
        if(ghost.parentNode) ghost.remove();
        el.style.opacity='';
        if(dragging){
          const br=board.getBoundingClientRect();
          if(ev.clientX>=br.left&&ev.clientX<=br.right&&ev.clientY>=br.top&&ev.clientY<=br.bottom){
            // drop on field - public play
            const idx=me.hand.findIndex(c=>c.uid===card.uid);
            if(idx>=0){
              me.hand.splice(idx,1)[0];
              me.field.push(card);
              const x=ev.clientX-br.left-br.width*0.067;
              const y=ev.clientY-br.top-br.height*0.05;
              createCardPiece(board,card,x,y);
              renderHand();broadcastState();
              toast('打出：'+card.name);
            }
          }
          setTimeout(()=>{el._handDragged=false;},50);
        }
      };
      document.addEventListener('mousemove',onMove);
      document.addEventListener('mouseup',onUp);
    });
    area.appendChild(el);
  });
}

function playFromHand(uid){
  const idx=me.hand.findIndex(c=>c.uid===uid);if(idx<0)return;
  const card=me.hand.splice(idx,1)[0];me.field.push(card);
  const f=pct(board,28+Math.random()*26,18+Math.random()*16);
  createCardPiece(board,card,f.x,f.y);
  renderHand();broadcastState();toast('打出：'+card.name);
}

function createCore(b,color,x,y,pid,pctPos){
  const id=pid||('c'+pieceSeq++);
  const el=document.createElement('div');
  el.className='piece core '+color;el.dataset.type='core';el.dataset.pid=id;el.dataset.color=color;
  if(pctPos){ el.dataset.px=String(pctPos.px); el.dataset.py=String(pctPos.py); applyPosPct(el); }
  else setPosPct(el,b,x,y);
  bumpZ(el);
  if(b===board) makeDraggable(el,null);
  else {
    el.style.cursor='pointer';
    el.oncontextmenu=e=>{e.preventDefault();e.stopPropagation(); /* cores no zoom */};
  }
  b.appendChild(el);return el;
}

function createCardPiece(b,card,x,y,pid,opts){
  opts=opts||{};
  const id=pid||('k'+pieceSeq++);
  const el=document.createElement('div');
  el.className='piece card';
  el.dataset.type='card';el.dataset.pid=id;el.dataset.uid=card.uid;
  if(opts.pctPos){ el.dataset.px=String(opts.pctPos.px); el.dataset.py=String(opts.pctPos.py); applyPosPct(el); }
  else setPosPct(el,b,x,y);
  el.innerHTML='<img src="'+(card.image||ph(card.name))+'" onerror="this.src=\''+ph(card.name)+'\'">';
  el._cardData=card;
  bumpZ(el);
  const fat = opts.fatigue!=null ? opts.fatigue : (opts.exhausted ? 1 : 0);
  setCardFatigue(el, fat);
  if(b===board){
    makeDraggable(el,card);
  } else {
    el.style.cursor='pointer';
    el.oncontextmenu=e=>{e.preventDefault();e.stopPropagation();showZoom(card);};
  }
  b.appendChild(el);return el;
}

function setCardFatigue(el, level){
  level = level ? 1 : 0;
  el.dataset.fatigue = String(level);
  el.classList.remove('fatigue-1','exhausted');
  if(level===1) el.classList.add('fatigue-1','exhausted');
  // cores always stay above cards
  if(typeof raiseAllCores==='function') raiseAllCores();
}
function getCardFatigue(el){
  return parseInt(el.dataset.fatigue||'0',10)||0;
}
function cycleCardFatigue(el){
  setCardFatigue(el, getCardFatigue(el) ? 0 : 1);
  raiseAllCores();
}

function makeDraggable(el,cardData){
  let sx,sy,ox,oy,dragging=false,timer=null,groupStart=null,posReady=false;
  el.addEventListener('mousedown',e=>{
    if(e.button!==0)return;
    e.stopPropagation();
    sx=e.clientX; sy=e.clientY;
    el._justDragged=false;
    posReady=false;
    groupStart=null;
    bumpZ(el);

    if(el.dataset.type==='core' && selectedCores.has(el)){
      // group prepared when drag actually starts
    } else if(el.dataset.type==='core'){
      clearCoreSelection();
    }


    function beginPixelDrag(){
      if(posReady) return;
      posReady=true;
      const br=board.getBoundingClientRect();
      // Use stored % center-stable layout position, not AABB after rotate
      if(el.dataset.px!=null){
        ox = parseFloat(el.dataset.px)/100 * br.width;
        oy = parseFloat(el.dataset.py)/100 * br.height;
      } else {
        // fallback unrotated offsetTop/Left relative to board
        ox = el.offsetLeft;
        oy = el.offsetTop;
      }
      el.style.left = ox+'px';
      el.style.top = oy+'px';

      if(el.dataset.type==='core' && selectedCores.has(el)){
        groupStart=new Map();
        selectedCores.forEach(c=>{
          let px,py;
          if(c.dataset.px!=null){
            px=parseFloat(c.dataset.px)/100*br.width;
            py=parseFloat(c.dataset.py)/100*br.height;
          } else {
            px=c.offsetLeft; py=c.offsetTop;
          }
          c.style.left=px+'px'; c.style.top=py+'px';
          groupStart.set(c,{x:px,y:py});
          bumpZ(c);
        });
      }
    }

    timer=setTimeout(()=>{
      dragging=true; el.classList.add('dragging');
      beginPixelDrag();
    },90);

    const onMove=ev=>{
      if(!dragging){
        if(Math.abs(ev.clientX-sx)>5||Math.abs(ev.clientY-sy)>5){
          clearTimeout(timer);
          dragging=true; el.classList.add('dragging');
          beginPixelDrag();
        }
        return;
      }
      el._justDragged=true;
      const dx=ev.clientX-sx, dy=ev.clientY-sy;
      if(groupStart && groupStart.size>1){
        groupStart.forEach((pos,c)=>{
          c.style.left=(pos.x+dx)+'px';
          c.style.top=(pos.y+dy)+'px';
        });
      } else {
        el.style.left=(ox+dx)+'px';
        el.style.top=(oy+dy)+'px';
      }
      const hd=document.getElementById('handDrop');
      const hr=document.getElementById('handBarSelf').getBoundingClientRect();
      if(ev.clientX>=hr.left&&ev.clientX<=hr.right&&ev.clientY>=hr.top&&ev.clientY<=hr.bottom)
        hd.classList.add('active'); else hd.classList.remove('active');
    };

    const onUp=ev=>{
      clearTimeout(timer);
      document.removeEventListener('mousemove',onMove);
      document.removeEventListener('mouseup',onUp);
      el.classList.remove('dragging');
      document.getElementById('handDrop').classList.remove('active');

      function commitPct(node){
        if(!node || !node.isConnected) return;
        const leftPx=parseFloat(node.style.left)||0;
        const topPx=parseFloat(node.style.top)||0;
        setPosPct(node, board, leftPx, topPx);
      }

      if(dragging){
        const hr=document.getElementById('handBarSelf').getBoundingClientRect();
        const inHand=ev.clientX>=hr.left&&ev.clientX<=hr.right&&ev.clientY>=hr.top&&ev.clientY<=hr.bottom;
        if(inHand){
          if(el.dataset.type==='core'){
            if(groupStart && groupStart.size>1){
              const n=groupStart.size;
              groupStart.forEach((_,c)=>{c.remove(); selectedCores.delete(c);});
              toast('已刪除 '+n+' 顆 Core');
            } else {
              el.remove(); selectedCores.delete(el); toast('已刪除 Core');
            }
            broadcastState();
          } else if(cardData){
            me.field=me.field.filter(c=>c.uid!==cardData.uid);
            me.trash=me.trash.filter(c=>c.uid!==cardData.uid);
            if(!me.hand.find(c=>c.uid===cardData.uid)) me.hand.push(cardData);
            el.remove(); renderHand(); toast('加入手牌'); broadcastState();
          }
        } else if(cardData && el.dataset.type==='card'){
          const deckZ=document.getElementById('zh-deck').getBoundingClientRect();
          if(ev.clientX>=deckZ.left&&ev.clientX<=deckZ.right&&ev.clientY>=deckZ.top&&ev.clientY<=deckZ.bottom){
            me.deckCards.push(cardData);
            me.field=me.field.filter(c=>c.uid!==cardData.uid);
            me.trash=me.trash.filter(c=>c.uid!==cardData.uid);
            el.remove(); renderDeckStack(); updateMeta(); renderTracker(); toast('放到牌底'); broadcastState();
          } else {
            commitPct(el); broadcastState();
          }
        } else {
          if(groupStart && groupStart.size>1) groupStart.forEach((_,c)=>commitPct(c));
          else commitPct(el);
          broadcastState();
        }
      } else {
        // pure click: do NOT rewrite position (keeps fatigue rotate in place)
        if(el.dataset.type==='card'){
          cycleCardFatigue(el);
          broadcastState();
        }
      }
      setTimeout(()=>{el._justDragged=false;},40);
      dragging=false; groupStart=null;
    };
    document.addEventListener('mousemove',onMove);
    document.addEventListener('mouseup',onUp);
  });
  if(cardData){
    el.addEventListener('contextmenu', e=>{
      e.preventDefault(); e.stopPropagation();
      showZoom(cardData);
    });
  }
}

// ===== Box select cores =====
let selectedCores = new Set();
let boxSelecting = false;
let boxStart = null;

function clearCoreSelection(){
  selectedCores.forEach(el => el.classList.remove('selected'));
  selectedCores.clear();
}
function selectCoresInRect(x1,y1,x2,y2){
  clearCoreSelection();
  const left=Math.min(x1,x2), right=Math.max(x1,x2);
  const top=Math.min(y1,y2), bottom=Math.max(y1,y2);
  const br = board.getBoundingClientRect();
  board.querySelectorAll('.piece.core').forEach(el=>{
    const r = el.getBoundingClientRect();
    const cx = r.left - br.left + r.width/2;
    const cy = r.top - br.top + r.height/2;
    if(cx>=left && cx<=right && cy>=top && cy<=bottom){
      selectedCores.add(el);
      el.classList.add('selected');
    }
  });
}

board.addEventListener('mousedown', function(e){
  if(e.button!==0) return;
  if(e.target.closest('.piece') || e.target.closest('.deck-stack')) return;
  boxSelecting = true;
  const br = board.getBoundingClientRect();
  boxStart = {x: e.clientX - br.left, y: e.clientY - br.top};
  const sb = document.getElementById('selBox');
  if(!sb) return;
  sb.style.display = 'block';
  sb.style.left = boxStart.x+'px';
  sb.style.top = boxStart.y+'px';
  sb.style.width = '0px';
  sb.style.height = '0px';

  const onMove = ev => {
    if(!boxSelecting) return;
    const br2 = board.getBoundingClientRect();
    const cx = ev.clientX - br2.left, cy = ev.clientY - br2.top;
    const l = Math.min(boxStart.x, cx), tp = Math.min(boxStart.y, cy);
    const w = Math.abs(cx - boxStart.x), h = Math.abs(cy - boxStart.y);
    sb.style.left = l+'px'; sb.style.top = tp+'px';
    sb.style.width = w+'px'; sb.style.height = h+'px';
  };
  const onUp = ev => {
    if(!boxSelecting) return;
    boxSelecting = false;
    const br2 = board.getBoundingClientRect();
    const cx = ev.clientX - br2.left, cy = ev.clientY - br2.top;
    const w = Math.abs(cx - boxStart.x), h = Math.abs(cy - boxStart.y);
    sb.style.display = 'none';
    if(w > 6 || h > 6){
      selectCoresInRect(boxStart.x, boxStart.y, cx, cy);
      if(selectedCores.size) toast('已選取 '+selectedCores.size+' 顆 Core');
    } else {
      clearCoreSelection();
    }
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
  };
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
});

function showZoom(card){
  document.getElementById('zoomImg').src=card.image||ph(card.name);
  document.getElementById('zoomMeta').textContent=card.name+' · '+card.number+' · '+card.color+' · 費'+card.cost;
  document.getElementById('zoomEffect').textContent=card.effect||'（無效果）';
  document.getElementById('zoomModal').classList.add('show');
}
document.getElementById('closeZoom').onclick=()=>document.getElementById('zoomModal').classList.remove('show');
document.getElementById('zoomModal').onclick=e=>{if(e.target.id==='zoomModal')e.target.classList.remove('show');};


// ===== WebSocket room (Supabase Realtime = WebSocket) =====
function ensureSb(){
  if(sb) return sb;
  if(typeof supabase==='undefined'){ toast('無法載入 supabase-js'); return null; }
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    realtime: { params: { eventsPerSecond: 20 } }
  });
  return sb;
}

function setWsStatus(state, text){
  const dot = document.getElementById('wsDot');
  const info = document.getElementById('roomInfo');
  const st = document.getElementById('roomStatus');
  if(dot){
    dot.style.background = state==='on' ? '#4ade80' : state==='pending' ? '#fbbf24' : '#64748b';
  }
  if(info && text!=null) info.textContent = text;
  if(st){
    if(roomCode && state==='on'){
      st.style.display='inline';
      st.textContent = '房間 '+roomCode;
    } else if(!roomCode){
      st.style.display='none';
    }
  }
}

function serializePublic(){
  const pieces=[];
  board.querySelectorAll('.piece').forEach(el=>{
    if(el.dataset.px==null){
      const w=board.clientWidth||1,h=board.clientHeight||1;
      const lx=parseFloat(el.style.left)||0, ly=parseFloat(el.style.top)||0;
      if(String(el.style.left).endsWith('%')){
        el.dataset.px=String(parseFloat(el.style.left));
        el.dataset.py=String(parseFloat(el.style.top));
      } else {
        el.dataset.px=String((lx/w)*100);
        el.dataset.py=String((ly/h)*100);
      }
    }
    pieces.push({
      pid:el.dataset.pid,type:el.dataset.type,color:el.dataset.color||null,
      uid:el.dataset.uid||null,cardId:el._cardData?el._cardData.id:null,
      px:parseFloat(el.dataset.px),py:parseFloat(el.dataset.py),
      z:parseInt(el.style.zIndex)||20,
      fatigue:getCardFatigue(el),exhausted:getCardFatigue(el)===1
    });
  });
  return {from:clientId,ts:Date.now(),deckCount:me.deckCards.length,handCount:me.hand.length,pieces};
}

function renderOppState(st){
  if(!st||st.from===clientId)return;
  boardOpp.querySelectorAll('.piece,.deck-stack').forEach(el=>el.remove());
  const pos=pct(boardOpp,83,12);
  const stack=document.createElement('div');
  stack.className='deck-stack';stack.textContent=st.deckCount||0;
  setPosPct(stack, boardOpp, pos.x, pos.y);
  stack.style.pointerEvents='none';
  boardOpp.appendChild(stack);
  (st.pieces||[]).forEach(p=>{
    let pctPos = null;
    if(p.px!=null && p.py!=null) pctPos = {px:p.px, py:p.py};
    else if(p.left!=null){
      const lx=parseFloat(p.left)||0, ly=parseFloat(p.top)||0;
      if(String(p.left).endsWith('%')) pctPos = {px:lx, py:ly};
      else {
        const w=boardOpp.clientWidth||1, h=boardOpp.clientHeight||1;
        pctPos = {px:(lx/w)*100, py:(ly/h)*100};
      }
    }
    if(p.type==='core'){
      const el=createCore(boardOpp,p.color||'blue',0,0,p.pid,pctPos);
      if(p.z) el.style.zIndex=String(p.z);
    } else if(p.type==='card'&&p.cardId){
      const base=cardById.get(p.cardId);if(!base)return;
      const card=Object.assign({},base,{uid:p.uid});
      const el=createCardPiece(boardOpp,card,0,0,p.pid,{fatigue:p.fatigue!=null?p.fatigue:(p.exhausted?1:0),pctPos:pctPos});
      if(p.z) el.style.zIndex=String(p.z);
    }
  });
  const area=document.getElementById('handAreaOpp');area.innerHTML='';
  const n=st.handCount||0;
  document.getElementById('oppMeta').textContent='已連線 · 手牌 '+n+' · 牌組 '+(st.deckCount||0);
  for(let i=0;i<Math.min(n,12);i++){
    const el=document.createElement('div');el.className='hand-card back';
    el.style.bottom='4px';
    el.style.left='calc(50% + '+(i-(Math.min(n,12)-1)/2)*28+'px - 24px)';
    el.style.zIndex=String(5+i);
    el.innerHTML='<img src="'+ph('?')+'">';
    area.appendChild(el);
  }
}

function broadcastState(){
  if(applyingRemote||!roomChannel)return;
  clearTimeout(broadcastTimer);
  broadcastTimer=setTimeout(()=>{
    try{
      roomChannel.send({type:'broadcast',event:'pub',payload:serializePublic()});
    }catch(e){ console.warn('ws send', e); }
  },80);
}

let wsWantRoom = null;
let wsRetryTimer = null;
let wsHeartbeat = null;

function stopWsHeartbeat(){
  if(wsHeartbeat){ clearInterval(wsHeartbeat); wsHeartbeat=null; }
}
function startWsHeartbeat(){
  stopWsHeartbeat();
  wsHeartbeat = setInterval(()=>{
    if(!roomChannel) return;
    try{
      roomChannel.send({type:'broadcast',event:'ping',payload:{from:clientId,ts:Date.now()}});
    }catch(e){}
  }, 15000);
}

async function createRoom(){
  const code=Math.random().toString(36).slice(2,8).toUpperCase();
  await joinRoom(code,true);
}

async function joinRoom(code,isCreator){
  const client=ensureSb(); if(!client) return;
  leaveRoom(false);
  roomCode=(code||'').trim().toUpperCase();
  if(!roomCode){ toast('請輸入代碼'); return; }
  wsWantRoom = { code: roomCode, isCreator: !!isCreator };
  setWsStatus('pending', '連線中…');

  roomChannel = client.channel('bs-ws-'+roomCode, {
    config: { broadcast: { self: false, ack: false } }
  });

  roomChannel.on('broadcast', { event: 'pub' }, ({payload})=>{
    applyingRemote=true;
    try{ renderOppState(payload); } finally { applyingRemote=false; }
  });
  roomChannel.on('broadcast', { event: 'hello' }, ({payload})=>{
    if(payload && payload.from!==clientId){
      toast('對手已連線');
      broadcastState();
    }
  });
  roomChannel.on('broadcast', { event: 'ping' }, ()=>{ /* heartbeat */ });

  const sub = await roomChannel.subscribe((status)=>{
    console.log('ws status', status);
    if(status==='SUBSCRIBED'){
      setWsStatus('on', '已連線 · '+roomCode+(isCreator?'（房主）':''));
      startWsHeartbeat();
      try{
        roomChannel.send({type:'broadcast',event:'hello',payload:{from:clientId}});
      }catch(e){}
      toast('已加入房間 '+roomCode);
      if(isCreator && deckTotal()>0) startNewGame();
      else broadcastState();
    } else if(status==='CHANNEL_ERROR' || status==='TIMED_OUT'){
      setWsStatus('off', '連線錯誤，重試中…');
      scheduleWsRetry();
    } else if(status==='CLOSED'){
      setWsStatus('off', '已斷線');
      scheduleWsRetry();
    }
  });
}

function scheduleWsRetry(){
  if(!wsWantRoom) return;
  if(wsRetryTimer) clearTimeout(wsRetryTimer);
  wsRetryTimer = setTimeout(()=>{
    if(!wsWantRoom) return;
    toast('重新連線…');
    joinRoom(wsWantRoom.code, wsWantRoom.isCreator);
  }, 2500);
}

function leaveRoom(clearWant){
  if(clearWant!==false) wsWantRoom = null;
  if(wsRetryTimer){ clearTimeout(wsRetryTimer); wsRetryTimer=null; }
  stopWsHeartbeat();
  if(roomChannel){
    try{ roomChannel.unsubscribe(); }catch(e){}
    roomChannel=null;
  }
  roomCode=null;
  setWsStatus('off', '');
  document.getElementById('oppMeta').textContent='未連線 · 手牌 ? · 牌組 ?';
  boardOpp.querySelectorAll('.piece,.deck-stack').forEach(el=>el.remove());
  const hopp=document.getElementById('handAreaOpp');
  if(hopp) hopp.innerHTML='';
}

document.getElementById('btnLeaveRoom').onclick=()=>{ leaveRoom(true); toast('已離開房間'); };

function renderTracker(){
  const list = document.getElementById('trackerList');
  if(!list) return;
  if(!me.deckCards || me.deckCards.length===0){
    list.innerHTML = '<div class="tracker-empty">牌組已空或尚未開始</div>';
    return;
  }
  // count by card id in remaining deck
  const counts = new Map();
  me.deckCards.forEach(c=>{
    const k = c.id;
    if(!counts.has(k)) counts.set(k, {card:c, qty:0});
    counts.get(k).qty++;
  });
  // sort by name
  const rows = [...counts.values()].sort((a,b)=> (a.card.name||'').localeCompare(b.card.name||'', 'zh'));
  list.innerHTML = '';
  rows.forEach(({card, qty})=>{
    const el = document.createElement('div');
    el.className = 'tracker-item';
    el.innerHTML = '<img src="'+(card.image||ph(card.name))+'" onerror="this.style.opacity=.3"><div class="tname">'+card.name+'</div><span class="tqty">' + qty + '</span>';
    el.oncontextmenu = e=>{ e.preventDefault(); showZoom(card); };
    list.appendChild(el);
  });
}

  }
});
