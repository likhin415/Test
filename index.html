<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Battle Spirits 沙盒</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0a0e14;--panel:#141c28;--panel2:#1e2a3c;--accent:#3b82f6;--text:#e8eef7;--muted:#94a3b8;--cw:9%;--ch:auto;--hw:100px;--hh:140px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
button{cursor:pointer;border:none;border-radius:8px;padding:7px 12px;font-size:13px;background:var(--accent);color:#fff;font-family:inherit;transition:.15s}
button:hover{filter:brightness(1.12)}
button.secondary{background:var(--panel2);color:var(--text);border:1px solid #334155}
button.danger{background:#dc2626}
button:disabled{opacity:.45;cursor:not-allowed}
input,select{background:var(--panel2);border:1px solid #334155;color:var(--text);padding:7px 10px;border-radius:8px;font-size:13px;font-family:inherit}
.nav{display:flex;gap:8px;padding:8px 14px;background:var(--panel);border-bottom:1px solid #1e293b;align-items:center;position:sticky;top:0;z-index:200;flex-wrap:wrap}
.nav h1{font-size:15px;margin-right:auto;font-weight:700}
.nav .tab{background:transparent;color:var(--muted)}
.nav .tab.active{background:var(--accent);color:#fff}
.pill{font-size:11px;padding:3px 8px;border-radius:999px;background:#1e293b;color:var(--muted)}
.pill.ok{color:#4ade80}.pill.err{color:#f87171}.pill.room{color:#60a5fa}
.view{display:none;padding:10px}.view.active{display:block}
.builder-layout{display:grid;grid-template-columns:1fr 340px;gap:12px;max-width:1500px;margin:0 auto}
@media(max-width:960px){.builder-layout{grid-template-columns:1fr}}
.filters{
  display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center;
  background:var(--panel);border:1px solid #243044;border-radius:12px;padding:10px 12px;
}
.filters #searchInput{
  flex:1 1 200px; min-width:160px; max-width:320px;
  background:#0f172a; border:1px solid #334155;
}
.filters #setFilter{
  min-width:auto; background:#1e293b; border:1px solid #334155; color:#cbd5e1;
  padding:6px 12px; border-radius:999px; font-size:12px; cursor:pointer;
}
.filters-right{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-left:auto}
.msel{position:relative; display:inline-block; vertical-align:middle}
.msel-btn{
  background:#1e293b; border:1px solid #334155; color:#cbd5e1;
  padding:6px 12px; border-radius:999px; font-size:12px; font-family:inherit;
  cursor:pointer; white-space:nowrap; line-height:1.3;
  transition: border-color .15s, background .15s, color .15s;
}
.msel-btn:hover{border-color:#64748b; color:#fff}
.msel-btn.has-val{border-color:var(--accent); background:#1e3a5f; color:#93c5fd; font-weight:600}
.msel-panel{
  display:none !important; position:absolute; left:0; top:calc(100% + 6px); z-index:400;
  background:#0f172a; border:1px solid #334155; border-radius:12px;
  padding:8px; min-width:168px; max-height:260px; overflow-y:auto;
  box-shadow:0 12px 32px rgba(0,0,0,.55);
}
.msel.open > .msel-panel{display:block !important}
.msel-panel label{
  display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:8px;
  font-size:12px; cursor:pointer; user-select:none; color:var(--text);
}
.msel-panel label:hover{background:#1e293b}
.msel-panel input{accent-color:var(--accent); width:14px; height:14px}

.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(115px,1fr));gap:8px}
.card-item{background:var(--panel);border-radius:8px;overflow:hidden;border:1px solid #243044;cursor:pointer;transition:.15s}
.card-item:hover{border-color:var(--accent);transform:translateY(-2px)}
.card-item img{width:100%;aspect-ratio:5/7;object-fit:cover;background:#0f172a;display:block}
.card-item .info{padding:5px 6px;font-size:11px}
.card-item .name{font-weight:600;line-height:1.2;margin-bottom:2px}
.card-item .meta{color:var(--muted);font-size:10px}
.deck-panel{
  background:var(--panel);border-radius:12px 12px 0 0;padding:0;
  border:1px solid #243044; border-bottom:none;
  position:fixed; left:0; right:0; bottom:0; z-index:350;
  max-height:min(85vh, 720px);
  display:flex; flex-direction:column;
  box-shadow:0 -8px 28px rgba(0,0,0,.45);
  transform:translateY(calc(100% - 48px));
  transition:transform .28s ease;
  overflow:hidden;
}
.deck-panel.open{transform:translateY(0)}
.deck-panel-handle{
  flex:0 0 48px; display:flex; align-items:center; justify-content:space-between;
  padding:0 14px; cursor:pointer; user-select:none;
  border-bottom:1px solid transparent;
}
.deck-panel.open .deck-panel-handle{border-bottom-color:#1e293b}
.deck-panel-handle h2{font-size:14px;margin:0;font-weight:700}
.deck-panel-handle .deck-chevron{
  font-size:12px; color:var(--muted); transition:transform .28s;
}
.deck-panel-body{
  display:none; flex:1; min-height:0; overflow:visible; padding:10px 12px 16px;
}
.deck-panel.open .deck-panel-body{display:block}
.deck-panel .deck-list{max-height:32vh; overflow-y:auto; margin-bottom:8px}
.builder-layout{padding-bottom:56px}
#view-builder:not(.active) .deck-panel{display:none !important}

@media(min-width:961px){
  .builder-layout{grid-template-columns:1fr 0px; gap:0}
  .deck-panel{
    left:auto; right:16px; bottom:12px; width:min(480px, 46vw);
    border-radius:14px; border:1px solid #243044;
    max-height:none;
  }
  .deck-panel.open{
    max-height:min(94vh, 960px);
    overflow:hidden;
  }
  /* 只有卡片列表可捲動，其餘區塊完整展示 */
  .deck-panel .deck-list{max-height:min(42vh, 380px); overflow-y:auto}
  .deck-panel-body{overflow:visible; max-height:none}
}

.deck-list{max-height:36vh;overflow-y:auto;margin-bottom:8px}
.deck-entry{display:flex;align-items:center;gap:6px;padding:3px 0;border-bottom:1px solid #1e293b;font-size:12px}
.deck-entry img{width:28px;height:40px;object-fit:cover;border-radius:3px;flex-shrink:0}
.deck-entry .qty{background:var(--accent);min-width:18px;text-align:center;border-radius:4px;font-size:11px}
.deck-actions{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.preset-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:8px}
.preset-grid button{font-size:11px;padding:6px 8px;text-align:left;line-height:1.3}
.play-wrap{max-width:1300px;margin:0 auto}
.room-panel{background:var(--panel);border:1px solid #243044;border-radius:10px;padding:10px;margin-bottom:8px}
.room-panel input{width:110px}
.play-toolbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px;align-items:center}
.play-toolbar .hint{font-size:10px;color:var(--muted);margin-left:auto;max-width:420px;text-align:right;line-height:1.3}
.seat{margin-bottom:4px}
.seat-label{font-size:11px;color:var(--muted);margin-bottom:2px;display:flex;justify-content:space-between}
.board-outer{position:relative;width:100%;border-radius:8px;overflow:hidden;border:2px solid #334155;background:#000}
.board{position:relative;width:100%;aspect-ratio:1100/782;background:#0a0a0a center/100% 100% no-repeat;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.seat.opp .board{transform:rotate(180deg)}
.zone-hit{position:absolute}
#zh-field{left:18%;top:8%;width:58%;height:52%}
#zh-life{left:2.5%;top:42%;width:14%;height:18%}
#zh-reserve{left:2.5%;top:62%;width:14%;height:16%}
#zh-deck{left:80%;top:6%;width:16%;height:28%}
#zh-trash{left:80%;top:42%;width:16%;height:36%}
#zh-void{left:2.5%;top:8%;width:14%;height:28%}
.piece{position:absolute;cursor:grab;z-index:20;touch-action:none;user-select:none;-webkit-user-select:none;outline:none;-webkit-tap-highlight-color:transparent}
.piece.core{z-index:100000}
.piece.card{z-index:20}
.piece.core.selected{outline:2px solid #60a5fa;outline-offset:2px;border-radius:50%}
.piece.dragging{cursor:grabbing;z-index:90;opacity:.92}
.piece.card{width:13.5%;aspect-ratio:5/7;height:auto}
.piece.card img{width:100%;height:100%;object-fit:cover;border-radius:4px;box-shadow:0 3px 10px rgba(0,0,0,.55);pointer-events:none;display:block;user-select:none;-webkit-user-select:none;-webkit-user-drag:none;-webkit-touch-callout:none}
.piece.card{transform-origin:center center}
.piece.card.fatigue-1,.piece.card.exhausted{transform:rotate(90deg)}
.piece.card.fatigue-2{transform:rotate(180deg)}
.piece.card.tool-target{outline:2px solid #fbbf24;outline-offset:2px}

.piece.core{
  width:3.15%;aspect-ratio:1;height:auto;min-width:22px;min-height:22px;
  border-radius:0; border:none; background-color:transparent;
  background-repeat:no-repeat; background-position:center; background-size:contain;
  box-shadow:none; filter:drop-shadow(0 2px 4px rgba(0,0,0,.55));
}
.piece.core.blue{ background-image:var(--core-blue); }
.piece.core.red{ background-image:var(--core-red); }
/* RESERVE Core/Soul：PC／手機皆往左上 5px（手機再與下方 media 疊加） */
.piece.core.core-reserve{
  transform: translate(-5px, -5px);
}
/* 手機：Core/Soul 15x15；預設往右 0.2px（PC 不受影響） */
@media (max-width: 900px) {
  .piece.core{
    width: 15px !important;
    height: 15px !important;
    min-width: 15px !important;
    min-height: 15px !important;
    max-width: 15px !important;
    max-height: 15px !important;
    transform: translate(0.2px, 0) !important;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,.65)) brightness(1.1);
  }
  /* 生命 5 顆：在手機基準上再往左上 2px → 淨 translate(-1.8px, -2px) */
  .piece.core.core-life{
    transform: translate(-1.8px, -2px) !important;
  }
  /* RESERVE：手機基準 0.2px 右 + 再往左上 5px → translate(-4.8px, -5px) */
  .piece.core.core-reserve{
    transform: translate(-4.8px, -5px) !important;
  }
}
@media (hover:none) and (pointer:coarse) {
  .piece.core{
    width: 15px !important;
    height: 15px !important;
    min-width: 15px !important;
    min-height: 15px !important;
    max-width: 15px !important;
    max-height: 15px !important;
    transform: translate(0.2px, 0) !important;
  }
  .piece.core.core-life{
    transform: translate(-1.8px, -2px) !important;
  }
  .piece.core.core-reserve{
    transform: translate(-4.8px, -5px) !important;
  }
}
.deck-stack{
  position:absolute;width:13.5%;aspect-ratio:5/7;height:auto;
  background:#0a0a0a center/cover no-repeat;
  border:1px solid #4b5563;border-radius:7px;
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(14px,2vw,24px);font-weight:800;color:#fff;
  cursor:pointer;user-select:none;
  box-shadow:0 4px 14px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.06);
  text-shadow:0 1px 3px rgba(0,0,0,.9);
}
.deck-stack::after{content:"牌組";position:absolute;bottom:6px;font-size:11px;font-weight:600;color:rgba(226,232,240,.9);text-shadow:0 1px 2px #000}
.hand-bar{position:relative;height:145px;margin-top:2px;background:linear-gradient(180deg,transparent,rgba(15,23,42,.92) 20%);border-radius:0 0 10px 10px;overflow:visible}
.hand-label{position:absolute;top:2px;left:8px;font-size:10px;color:var(--muted);z-index:1}
.hand-count{position:absolute;top:2px;right:8px;font-size:11px;color:var(--muted)}
.hand-area{position:absolute;left:0;right:0;bottom:0;height:138px;pointer-events:none;overflow:visible}
.hand-drop{position:absolute;inset:0;border:2px dashed transparent;border-radius:8px;pointer-events:none;z-index:5}
.hand-drop.active{border-color:rgba(96,165,250,.7);background:rgba(59,130,246,.12)}
.hand-card{position:absolute;width:min(100px,12vw);aspect-ratio:5/7;height:auto;bottom:4px;transform-origin:bottom center;transition:transform .15s,bottom .15s,left .15s;cursor:pointer;pointer-events:auto;border-radius:5px;box-shadow:0 5px 14px rgba(0,0,0,.5);user-select:none;-webkit-user-select:none;outline:none;will-change:transform,left,bottom}
.hand-card img{width:100%;height:100%;object-fit:cover;border-radius:5px;pointer-events:none;display:block;user-select:none;-webkit-user-drag:none}
.hand-card:hover{bottom:18px!important;z-index:50!important;transform:scale(1.07)!important}
.hand-card.back{
  filter:none;pointer-events:none;width:42px;height:58px;
  background:linear-gradient(145deg,#1e3a5f 0%,#0f172a 55%,#1e293b 100%);
  border:1.5px solid #475569;border-radius:5px;
  box-shadow:0 3px 8px rgba(0,0,0,.45);
}
.hand-card.back img{display:none}
.hand-card.back::after{
  content:'';position:absolute;inset:6px;border:1px solid rgba(148,163,184,.35);
  border-radius:3px;background:
    radial-gradient(circle at 50% 45%,rgba(96,165,250,.25) 0%,transparent 55%),
    linear-gradient(135deg,transparent 40%,rgba(148,163,184,.12) 50%,transparent 60%);
}
.opp-hand-bar{position:relative;height:78px;margin-bottom:2px;background:linear-gradient(0deg,transparent,rgba(15,23,42,.88) 25%);border-radius:10px 10px 0 0}
.opp-hand-count{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  z-index:30;pointer-events:none;
  font-size:18px;font-weight:800;letter-spacing:.02em;
  color:#e2e8f0;text-shadow:0 2px 8px rgba(0,0,0,.85);
  background:rgba(15,23,42,.72);border:1px solid #334155;
  padding:4px 12px;border-radius:999px;min-width:3.2em;text-align:center;
}
.opp-hand-count.empty{opacity:.45;font-size:13px;font-weight:600}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:600000;align-items:center;justify-content:center}
.modal-bg.show{display:flex}
.modal-content{max-width:92vw;max-height:92vh;background:var(--panel);border-radius:12px;padding:14px;position:relative;border:1px solid #334155}
.modal-content img{max-width:min(360px,85vw);max-height:65vh;border-radius:8px;display:block;margin:0 auto}
.modal-content .close{position:absolute;top:4px;right:8px;font-size:24px;background:transparent;color:#fff;padding:0 8px}
.modal-meta{margin-top:8px;font-size:13px;font-weight:600;text-align:center}
.modal-effect{max-width:360px;margin:6px auto 0;font-size:12px;line-height:1.5;white-space:pre-wrap;color:var(--muted);max-height:140px;overflow-y:auto}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--panel2);padding:9px 16px;border-radius:8px;border:1px solid #475569;z-index:700000;opacity:0;transition:.25s;pointer-events:none;font-size:13px}
.toast.show{opacity:1}
.loading-overlay{position:fixed;inset:0;background:rgba(10,14,20,.88);z-index:600000;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px}
.loading-overlay.hidden{display:none}
.spinner{width:34px;height:34px;border:3px solid #334155;border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.piece.core.touch-sel{outline:2px solid #fbbf24;outline-offset:2px;box-shadow:0 0 0 3px rgba(251,191,36,.35)}
@media(hover:none) and (pointer:coarse){
  .hand-actions{flex:0 0 64px;height:120px}
  .hand-bar{height:120px}
  .hand-card{width:min(88px,22vw)}
  .hand-card:hover{bottom:4px!important;transform:none!important}
  .hand-card.hand-lift{bottom:22px!important;z-index:60!important;transform:scale(1.08)!important}
}


.hand-row{display:flex;flex-direction:row;flex-wrap:nowrap;align-items:stretch;gap:8px;margin-top:4px;width:100%}
.hand-actions{
  display:flex;flex-direction:column;justify-content:stretch;align-items:stretch;
  gap:3px;flex:0 0 72px;padding:0;height:145px;box-sizing:border-box;
}
.hand-actions button{
  flex:1 1 0;min-width:0;width:100%;font-size:11px;padding:0 4px;
  white-space:nowrap;box-sizing:border-box;
}
.hand-row .hand-bar{flex:1 1 auto;min-width:0;margin-top:0}


.play-main{display:grid;grid-template-columns:1fr 260px;gap:12px;align-items:start}
@media(max-width:900px){
  .play-main{grid-template-columns:1fr}
}

.tracker{
  background:var(--panel);border:1px solid #243044;border-radius:10px;
  padding:12px;position:sticky;top:56px;max-height:calc(100vh - 80px);overflow-y:auto;
}
.tracker h3{font-size:14px;margin-bottom:10px;color:var(--muted);font-weight:600}
.tracker-item{
  display:flex;align-items:center;gap:8px;padding:6px 0;
  border-bottom:1px solid #1e293b;font-size:12px;cursor:context-menu;
}
.tracker-item img{width:44px;height:62px;object-fit:cover;border-radius:4px;flex-shrink:0;background:#0f172a}
.tracker-item .tname{flex:1;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tracker-item .tqty{
  background:#1e293b;min-width:26px;text-align:center;border-radius:4px;
  font-size:14px;font-weight:700;padding:3px 6px;
}
.tracker-item .tqty.zero{opacity:.35;color:var(--muted)}
.tracker-empty{font-size:11px;color:var(--muted);padding:8px 0}

/* 手機記牌器：高度約一半（約 4 行），必須放在基礎規則之後才會生效 */
@media (max-width: 900px) {
  .tracker{
    max-height: 250px !important;
    position: relative;
    top: auto;
    overflow-y: auto;
    padding: 8px;
  }
  .tracker h3{ font-size: 12px; margin-bottom: 6px; }
  .tracker-item{ padding: 3px 0; gap: 6px; min-height: 0; }
  .tracker-item img{ width: 28px; height: 40px; }
  .tracker-item .tname{ font-size: 11px; -webkit-line-clamp: 1; }
  .tracker-item .tqty{ font-size: 12px; min-width: 22px; padding: 2px 4px; }
}
@media (hover:none) and (pointer:coarse) {
  .tracker{ max-height: 250px !important; }
}


.sel-box{position:absolute;border:1px solid #60a5fa;background:rgba(59,130,246,.15);pointer-events:none;z-index:100;display:none}


.play-toolbar{
  display:flex;flex-wrap:wrap;gap:6px;align-items:center;
  background:var(--panel);border:1px solid #243044;border-radius:10px;
  padding:8px 10px;margin-bottom:8px;position:sticky;top:48px;z-index:150;
}
.play-toolbar button{font-size:12px;padding:6px 10px}
.play-toolbar button.tool-on{background:#f59e0b;color:#111;font-weight:700}
.play-toolbar .tb-sep{width:1px;height:22px;background:#334155;margin:0 2px}
.play-toolbar .tb-hint{font-size:11px;color:var(--muted);margin-left:auto}
.deck-view-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:550000;align-items:center;justify-content:center;padding:12px}
.deck-view-bg.show{display:flex}
.deck-view-box{background:var(--panel);border:1px solid #334155;border-radius:12px;padding:12px;max-width:min(1100px,96vw);max-height:92vh;overflow:auto;width:100%}
.deck-view-box h3{font-size:15px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.deck-view-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.deck-view-grid .dv-card{background:#0f172a;border-radius:8px;overflow:hidden;border:1px solid #243044}
.deck-view-grid .dv-card img{width:100%;aspect-ratio:5/7;object-fit:cover;display:block}
.deck-view-grid .dv-card .dn{font-size:11px;padding:4px 6px;line-height:1.2}
.deck-view-grid .dv-card .dq{position:absolute;top:4px;right:4px;background:var(--accent);border-radius:4px;padding:1px 6px;font-size:11px;font-weight:700}
.deck-view-grid .dv-card{position:relative}
.saved-decks{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.saved-deck-row{display:flex;align-items:center;gap:6px;font-size:12px;padding:4px 0;border-bottom:1px solid #1e293b}
.saved-deck-row .sd-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mobile-deck-fab{
  display:none;position:fixed;right:12px;bottom:16px;z-index:400;
  background:var(--accent);color:#fff;border-radius:999px;padding:12px 16px;
  font-size:14px;font-weight:700;box-shadow:0 4px 16px rgba(0,0,0,.4);
}
.mobile-deck-drawer{
  display:none;position:fixed;left:0;right:0;bottom:0;z-index:450;
  background:var(--panel);border-top:1px solid #334155;border-radius:14px 14px 0 0;
  max-height:55vh;flex-direction:column;box-shadow:0 -8px 30px rgba(0,0,0,.45);
}
.mobile-deck-drawer.open{display:flex}
.mobile-deck-drawer .mdd-head{
  display:flex;align-items:center;justify-content:space-between;padding:10px 14px;
  border-bottom:1px solid #1e293b;font-size:14px;font-weight:600;
}
.mobile-deck-drawer .mdd-body{overflow-y:auto;padding:8px 12px;flex:1}
@media(max-width:960px){
  .builder-layout{grid-template-columns:1fr; gap:10px}
  .mobile-deck-fab, .mobile-deck-drawer{display:none !important}
  .filters{gap:6px; padding:8px}
  .filters-right{margin-left:0; width:100%}
  .msel-btn{font-size:11px; padding:5px 10px}

<body>
<div class="loading-overlay" id="loadingOverlay"><div class="spinner"></div><div id="loadingText">正在載入卡表…</div></div>
<nav class="nav">
  <h1>⚔️ Battle Spirits 沙盒</h1>
  <button class="tab active" data-view="builder">組建牌組</button>
  <button class="tab" data-view="play">沙盒遊玩</button>
  <span class="pill" id="cardStatus">卡表載入中</span>
  <span class="pill room" id="roomStatus" style="display:none"></span>
</nav>

<div id="view-builder" class="view active">
  <div class="builder-layout">
    <div>
      <div class="filters">
        <input type="text" id="searchInput" placeholder="搜尋卡號、名稱、效果…">
        <div class="filters-right">
          <select id="setFilter"><option value="">系列</option></select>
          <div class="msel" id="mselColor" data-key="color">
            <button type="button" class="msel-btn">顏色 ▾</button>
            <div class="msel-panel" id="colorChecks">
              <label data-v="紅"></label>
              <label data-v="紫"></label>
              <label data-v="綠"></label>
              <label data-v="白"></label>
              <label data-v="黃"></label>
              <label data-v="藍"></label>
            </div>
          </div>
          <div class="msel" id="mselType" data-key="type">
            <button type="button" class="msel-btn">種類 ▾</button>
            <div class="msel-panel" id="typeChecks">
              <label data-v="戰魂"></label>
              <label data-v="核心"></label>
              <label data-v="魔法"></label>
            </div>
          </div>
          <div class="msel" id="mselPrefix" data-key="prefix">
            <button type="button" class="msel-btn">前綴 ▾</button>
            <div class="msel-panel" id="prefixChecks"></div>
          </div>
          <div class="msel" id="mselSuffix" data-key="suffix">
            <button type="button" class="msel-btn">後綴 ▾</button>
            <div class="msel-panel" id="suffixChecks"></div>
          </div>
          <button class="secondary" id="btnClearFilter" style="border-radius:999px;padding:6px 12px;font-size:12px">重置</button>
          <span id="resultCount" style="font-size:11px;color:var(--muted)"></span>
        </div>
      </div>
      <div class="card-grid" id="cardGrid"></div>
    </div>
    <div class="deck-panel" id="deckPanel">
      <div class="deck-panel-handle" id="deckPanelHandle" title="點擊展開／收合">
        <h2>我的牌組 <span id="deckCount">(0)</span></h2>
        <span class="deck-chevron">▲ 展開</span>
      </div>
      <div class="deck-panel-body" id="deckPanelBody">
        <div class="deck-list" id="deckList"></div>
        <div class="deck-actions">
          <button id="btnStartPlay">沙盒遊玩</button>
          <button class="secondary" id="btnViewDeck">檢視牌組</button>
          <button class="secondary" id="btnSaveLocal">儲存牌組</button>
          <button class="secondary" id="btnExport">匯出</button>
          <button class="secondary" id="btnImport">匯入</button>
          <button class="danger" id="btnClearDeck">清空</button>
          <input type="file" id="importFile" accept=".json" style="display:none">
        </div>
        <div style="font-size:12px;margin-top:8px;color:var(--muted)">我的牌組</div>
        <div class="saved-decks" id="savedDecksList"></div>
        <div style="font-size:12px;margin-top:10px;color:var(--muted)">預設牌組</div>
        <div class="preset-grid" id="presetGrid"></div>
      </div>
    </div>
  </div>
</div>

<div id="view-play" class="view">
  <div class="play-wrap">
    <div class="room-panel">
      <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:4px">
        <span style="font-size:12px;color:var(--muted)">線上房間：</span>
        <button id="btnCreateRoom">建立房間</button>
        <input id="roomCodeInput" placeholder="房間代碼" maxlength="4">
        <button class="secondary" id="btnJoinRoom">加入</button>
        <button class="secondary" id="btnLeaveRoom">離開</button>
        <span id="wsDot" style="width:8px;height:8px;border-radius:50%;background:#64748b;display:inline-block"></span>
        <span id="roomInfo" style="font-size:12px;color:var(--muted)"></span>
      </div>
      
    </div>

    <div class="play-main">
    <div class="play-boards">
    <div class="seat opp" id="seatOpp">
      <div class="seat-label" style="display:none"><span>對手</span><span id="oppMeta"></span></div>
      <div class="hand-bar opp-hand-bar" id="handBarOpp">
        <span class="hand-label">對手手牌</span>
        <span class="opp-hand-count empty" id="oppHandCount">—</span>
        <div class="hand-area" id="handAreaOpp" style="height:72px"></div>
      </div>
      <div class="board-outer"><div class="board" id="boardOpp"></div></div>
    </div>

    <div class="seat self" id="seatSelf">
      <div class="seat-label"><span>自己</span><span id="selfMeta">手牌 0 · 牌組 0</span></div>
      <div class="board-outer">
        <div class="board" id="boardSelf">
          <div class="zone-hit" id="zh-field"></div>
          <div class="zone-hit" id="zh-life"></div>
          <div class="zone-hit" id="zh-reserve"></div>
          <div class="zone-hit" id="zh-deck"></div>
          <div class="zone-hit" id="zh-trash"></div>
          <div class="zone-hit" id="zh-void"></div>
          <div class="sel-box" id="selBox"></div>
        </div>
      </div>
      <div class="hand-row">
        <div class="hand-bar" id="handBarSelf" style="flex:1;min-width:0">
          <span class="hand-label">手牌（僅自己可見）</span>
          <span class="hand-count" id="handCount">0 張</span>
          <div class="hand-drop" id="handDrop"></div>
          <div class="hand-area" id="handArea"></div>
        </div>
      </div>
      <div class="play-toolbar" id="playToolbar">
        <button id="btnNewGame">重開</button>
        <button class="secondary" id="btnShuffleDeck">洗牌</button>
        <button class="secondary" id="btnAddBlueCore">+Core</button>
        <button class="secondary" id="btnToolVoid" title="再點卡牌除外">除外</button>
        <button class="secondary" id="btnToolRefatigue" title="再點卡牌重疲勞(180°)">重疲勞</button>
        <button class="secondary" id="btnCoinFlip">擲硬幣</button>
        <button class="secondary" id="btnToolInspect" title="再點場上卡放大">檢視</button>
        <button class="secondary" id="btnUndo" title="回復上一動">還原</button>
        <div class="tb-hint" id="toolHint"></div>
      </div>
    </div>
    </div><!-- play-boards -->

    <aside class="tracker" id="trackerPanel">
      <h3>記牌器 · 牌組剩餘</h3>
      <div id="trackerList"><div class="tracker-empty">開始遊戲後顯示</div></div>
    </aside>
    </div><!-- play-main -->
  </div>
</div>

<div class="modal-bg" id="zoomModal">
  <div class="modal-content">
    <button class="close" id="closeZoom">×</button>
    <img id="zoomImg" src="" alt="">
    <div class="modal-meta" id="zoomMeta"></div>
    <div class="modal-effect" id="zoomEffect"></div>
  </div>
</div>
<div class="deck-view-bg" id="deckViewModal">
  <div class="deck-view-box">
    <h3><span id="deckViewTitle">牌組檢視</span><button class="secondary" id="closeDeckView">關閉</button></h3>
    <div class="deck-view-grid" id="deckViewGrid"></div>
  </div>
</div>
<button class="mobile-deck-fab" id="mobileDeckFab" type="button">牌組 <span id="mobileDeckFabCount">0</span></button>
<div class="mobile-deck-drawer" id="mobileDeckDrawer">
  <div class="mdd-head">
    <span>我的牌組 <span id="mobileDeckCount">(0)</span></span>
    <button class="secondary" id="mobileDeckClose" type="button">收合</button>
  </div>
  <div class="mdd-body" id="mobileDeckBody"></div>
</div>

let deckComposition={}; // id -> starting qty for tracker
let toolMode=null; // inspect | void | refatigue

const HISTORY_MAX=40;
let undoing=false;

function cloneCard(c){ return Object.assign({}, c); }

function captureState(){
  const pieces=[];
  board.querySelectorAll('.piece').forEach(el=>{
    if(el.dataset.px==null){
      const w=board.clientWidth||1,h=board.clientHeight||1;
      const lx=parseFloat(el.style.left)||0, ly=parseFloat(el.style.top)||0;
      if(String(el.style.left).endsWith('%')){
        el.dataset.px=String(parseFloat(el.style.left));
        el.dataset.py=String(parseFloat(el.style.top));
      } else {
        el.dataset.px=String((lx/w)*100);
        el.dataset.py=String((ly/h)*100);
      }
    }
    pieces.push({
      pid:el.dataset.pid, type:el.dataset.type, color:el.dataset.color||null,
      uid:el.dataset.uid||null, cardId:el._cardData?el._cardData.id:null,
      card: el._cardData ? cloneCard(el._cardData) : null,
      px:parseFloat(el.dataset.px), py:parseFloat(el.dataset.py),
      z:parseInt(el.style.zIndex)||20,
      fatigue:getCardFatigue(el)
    });
  });
  return {
    me:{
      deckCards: me.deckCards.map(cloneCard),
      hand: me.hand.map(cloneCard),
      field: me.field.map(cloneCard),
      trash: me.trash.map(cloneCard)
    },
    pieces,
    pieceSeq
  };
}

function pushHistory(){
  if(undoing || applyingRemote) return;
  try{
    historyStack.push(captureState());
    if(historyStack.length>HISTORY_MAX) historyStack.shift();
  }catch(e){ console.warn('pushHistory', e); }
}

function restoreState(st){
  if(!st) return;
  undoing=true;
  try{
    board.querySelectorAll('.piece,.deck-stack').forEach(el=>el.remove());
    document.getElementById('handArea').innerHTML='';
    me={
      deckCards: (st.me.deckCards||[]).map(cloneCard),
      hand: (st.me.hand||[]).map(cloneCard),
      field: (st.me.field||[]).map(cloneCard),
      trash: (st.me.trash||[]).map(cloneCard)
    };
    pieceSeq = st.pieceSeq||pieceSeq;
    (st.pieces||[]).forEach(p=>{
      const pctPos = (p.px!=null && p.py!=null) ? {px:p.px, py:p.py} : null;
      if(p.type==='core'){
        const el=createCore(board, p.color||'blue', 0, 0, p.pid, pctPos);
        if(p.z) el.style.zIndex=String(p.z);
      } else if(p.type==='card'){
        const card = p.card ? cloneCard(p.card) : (p.cardId && cardById.get(p.cardId) ? Object.assign({}, cardById.get(p.cardId), {uid:p.uid}) : null);
        if(!card) return;
        if(p.uid) card.uid=p.uid;
        const el=createCardPiece(board, card, 0, 0, p.pid, {fatigue:p.fatigue||0, pctPos:pctPos});
        if(p.z) el.style.zIndex=String(p.z);
      }
    });
    renderDeckStack();
    renderHand();
    updateMeta();
    renderTracker();
    raiseAllCores();
    broadcastState();
  } finally {
    undoing=false;
  }
}

function undoLast(){
  if(!historyStack.length){ toast('沒有可還原的動作'); return; }
  const st=historyStack.pop();
  restoreState(st);
  toast('已還原上一動');
}

function toast(m,ms){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._tid);t._tid=setTimeout(()=>t.classList.remove('show'),ms||2200);}
window._lastTouchAt=0;
document.addEventListener('touchstart',()=>{window._lastTouchAt=Date.now();},{passive:true,capture:true});
document.addEventListener('pointerdown',e=>{if(e.pointerType==='touch') window._lastTouchAt=Date.now();},{passive:true,capture:true});
function isTouchDerivedEvent(e){
  if(Date.now()-window._lastTouchAt<1000) return true;
  try{
    if(e&&e.sourceCapabilities&&e.sourceCapabilities.firesTouchEvents) return true;
  }catch(err){}
  if(e&&e.pointerType==='touch') return true;
  return false;
}

async function loadCards(){
  const st=document.getElementById('cardStatus');
  try{
    const res=await fetch(SUPABASE_URL+'/rest/v1/cards?select=id,card_name,card_number,set_code,color,type,cost,rarity,image_url,effect,system,suffix&order=set_code.asc,card_number.asc&limit=2000',{headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY}});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data=await res.json();
    ALL_CARDS=data.map(c=>({id:c.id,name:c.card_name||'未知',number:c.card_number||'',set:c.set_code||'',color:c.color||'',type:c.type||'',cost:c.cost!=null?c.cost:0,rarity:c.rarity||'',image:c.image_url||'',effect:c.effect||'',system:c.system||'',suffix:c.suffix||''}))
      .filter(c=>!String(c.type||'').includes('勇武'));
    cardById=new Map(ALL_CARDS.map(c=>[c.id,c]));
    const sets=[...new Set(ALL_CARDS.map(c=>c.set).filter(Boolean))].sort();
    const sel=document.getElementById('setFilter');
    sets.forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent=s;sel.appendChild(o);});
    // 前綴(system) / 後綴(suffix) — 用 textContent 避免 <EX-AID> 被當成 HTML 標籤
    function fillMselPanel(id, values){
      const box=document.getElementById(id); if(!box) return;
      box.innerHTML='';
      values.forEach(v=>{
        const lab=document.createElement('label');
        const inp=document.createElement('input');
        inp.type='checkbox';
        inp.value=v;
        lab.appendChild(inp);
        lab.appendChild(document.createTextNode(' '+v));
        box.appendChild(lab);
      });
      box.querySelectorAll('input').forEach(inp=>inp.addEventListener('change',()=>{ updateMselButtons(); renderCardGrid(); }));
    }
    // 靜態顏色/類型 label 初始化
    document.querySelectorAll('#colorChecks label[data-v], #typeChecks label[data-v]').forEach(lab=>{
      const v=lab.getAttribute('data-v');
      lab.innerHTML='';
      const inp=document.createElement('input');
      inp.type='checkbox'; inp.value=v;
      lab.appendChild(inp);
      lab.appendChild(document.createTextNode(' '+v));
      inp.addEventListener('change',()=>{ updateMselButtons(); renderCardGrid(); });
    });
    const systems=[...new Set(ALL_CARDS.flatMap(c=>{
      const m=String(c.system||'').match(/<[^>]+>/g);
      return m|| (c.system ? [c.system] : []);
    }))].map(s=>s.replace(/^<|>$/g,'')).filter(Boolean).sort((a,b)=>a.localeCompare(b,'zh'));
    const suffixes=[...new Set(ALL_CARDS.map(c=>{
      const s=c.suffix||'';
      const m=s.match(/<[^>]+>/g);
      if(m) return m.map(x=>x.replace(/^<|>$/g,''));
      return s ? [s] : [];
    }).flat())].filter(Boolean).sort((a,b)=>a.localeCompare(b,'zh'));
    fillMselPanel('prefixChecks', systems);
    fillMselPanel('suffixChecks', suffixes);
    setupMsel();
    updateMselButtons();
    st.textContent='卡表 '+ALL_CARDS.length+' 張';st.classList.add('ok');
    document.getElementById('loadingOverlay').classList.add('hidden');
    renderCardGrid();renderDeckList();buildPresets();renderSavedDecks();
  }catch(e){st.textContent='卡表失敗';st.classList.add('err');document.getElementById('loadingText').textContent=String(e);toast('卡表載入失敗');}
}

function buildPresets(){
  const g=document.getElementById('presetGrid');g.innerHTML='';
  Object.keys(PRESETS).forEach(name=>{
    const b=document.createElement('button');b.className='secondary';b.textContent=name;
    b.onclick=()=>{deck=Object.assign({},PRESETS[name]);saveDeck();toast('已載入：'+name);};
    g.appendChild(b);
  });

function pct(b,x,y){return{x:(x/100)*b.clientWidth,y:(y/100)*b.clientHeight};}
function setPosPct(el,b,leftPx,topPx){
  const w=b.clientWidth||1, h=b.clientHeight||1;
  el.dataset.px=String((leftPx/w)*100);
  el.dataset.py=String((topPx/h)*100);
  el.style.left=((leftPx/w)*100)+'%';
  el.style.top=((topPx/h)*100)+'%';
}
function applyPosPct(el){
  if(el.dataset.px!=null) el.style.left=el.dataset.px+'%';
  if(el.dataset.py!=null) el.style.top=el.dataset.py+'%';
}
function readPosPct(el,b){
  // return pixel from %
  const w=b.clientWidth||1, h=b.clientHeight||1;
  if(el.dataset.px!=null) return {x:parseFloat(el.dataset.px)/100*w, y:parseFloat(el.dataset.py)/100*h};
  return {x:parseFloat(el.style.left)||0, y:parseFloat(el.style.top)||0};
}
let cardZ = 50;
let coreZ = 100000;
function bumpZ(el){
  if(el && el.dataset && el.dataset.type==='core'){
    coreZ++;
    el.style.zIndex = String(coreZ);
  } else {
    cardZ++;
    // never let cards reach core layer
    if(cardZ >= 99999) cardZ = 50;
    el.style.zIndex = String(cardZ);
  }
}

function handCardWidth(){
  // 對應 CSS：桌面 min(100px,12vw)；手機 min(88px,22vw)
  try{
    if(window.matchMedia('(hover:none) and (pointer:coarse)').matches){
      return Math.min(88, Math.max(52, window.innerWidth * 0.22));
    }
  }catch(e){}
  return Math.min(100, Math.max(60, window.innerWidth * 0.12));
}

function renderHand(){
  const area=document.getElementById('handArea');area.innerHTML='';
  const n=me.hand.length;updateMeta();
  if(!n)return;

  // 爐石式扇形：依手牌區實際寬度動態壓縮間距，避免超出邊界
  const areaW = area.clientWidth || (area.parentElement && area.parentElement.clientWidth) || Math.max(200, window.innerWidth - 100);
  const cardW = handCardWidth();
  const pad = 6;
  // 左右各留半張卡寬，確保最外緣卡牌不超出
  const maxSpan = Math.max(0, areaW - cardW - pad * 2);
  const idealGap = Math.min(70, cardW * 0.68);
  let totalSpan = n <= 1 ? 0 : (n - 1) * idealGap;
  if(totalSpan > maxSpan) totalSpan = maxSpan;
  const spread = n <= 1 ? 0 : totalSpan / (n - 1);
  const startX = -totalSpan / 2;
  // 邊緣旋轉隨張數略增，但整體收斂，避免手機大角度裁切
  const maxRot = Math.min(10, 2.5 + n * 0.55);

  me.hand.forEach((card,i)=>{
    const el=document.createElement('div');el.className='hand-card';el.dataset.uid=card.uid;
    const t = n === 1 ? 0 : (i / (n - 1)) * 2 - 1; // -1 … +1
    const offset = startX + i * spread;
    const rot = t * maxRot;
    el.style.width = cardW + 'px';
    el.style.left = 'calc(50% + ' + offset + 'px - ' + (cardW / 2) + 'px)';
    el.style.transform = 'rotate(' + rot + 'deg)';
    el.style.zIndex = String(10 + i);
    el.innerHTML='<img src="'+(card.image||ph(card.name))+'" onerror="this.src=\''+ph(card.name)+'\'">';
    el.onclick=e=>{e.stopPropagation(); if(!el._handDragged) playFromHand(card.uid);};
    el.oncontextmenu=e=>{e.preventDefault();showZoom(card);};
    // drag from hand to field
    el.addEventListener('mousedown', e=>{
      if(e.button!==0) return;
      e.stopPropagation();
      let dragging=false, sx=e.clientX, sy=e.clientY;
      el._handDragged=false;
      const ghost=el.cloneNode(true);
      ghost.style.position='fixed';
      ghost.style.pointerEvents='none';
      ghost.style.zIndex='9999';
      ghost.style.opacity='0.85';
      ghost.style.transform='none';
      ghost.style.margin='0';
      ghost.style.left=e.clientX-40+'px';
      ghost.style.top=e.clientY-60+'px';
      ghost.style.width=el.offsetWidth+'px';
      ghost.style.height=el.offsetHeight+'px';
      const onMove=ev=>{
        if(!dragging){
          if(Math.abs(ev.clientX-sx)>6||Math.abs(ev.clientY-sy)>6){
            dragging=true; el._handDragged=true;
            document.body.appendChild(ghost);
            el.style.opacity='0.35';
          }
          return;
        }
        ghost.style.left=ev.clientX-40+'px';
        ghost.style.top=ev.clientY-60+'px';
      };
      const onUp=ev=>{
        document.removeEventListener('mousemove',onMove);
        document.removeEventListener('mouseup',onUp);
        if(ghost.parentNode) ghost.remove();
        el.style.opacity='';
        if(dragging){
          const br=board.getBoundingClientRect();
          if(ev.clientX>=br.left&&ev.clientX<=br.right&&ev.clientY>=br.top&&ev.clientY<=br.bottom){
            // drop on field - public play
            const idx=me.hand.findIndex(c=>c.uid===card.uid);
            if(idx>=0){
              pushHistory();
              me.hand.splice(idx,1)[0];
              me.field.push(card);
              const x=ev.clientX-br.left-br.width*0.067;
              const y=ev.clientY-br.top-br.height*0.05;
              createCardPiece(board,card,x,y);
              renderHand();broadcastState();
              toast('打出：'+card.name);
            }
          }
          setTimeout(()=>{el._handDragged=false;},50);
        }
      };
      document.addEventListener('mousemove',onMove);
      document.addEventListener('mouseup',onUp);
    });
    area.appendChild(el);
  });
}

function playFromHand(uid){

function createCore(b,color,x,y,pid,pctPos){
  const id=pid||('c'+pieceSeq++);
  const el=document.createElement('div');
  el.className='piece core '+color;el.dataset.type='core';el.dataset.pid=id;el.dataset.color=color;
  if(pctPos){ el.dataset.px=String(pctPos.px); el.dataset.py=String(pctPos.py); applyPosPct(el); }
  else setPosPct(el,b,x,y);
  bumpZ(el);
  if(b===board) makeDraggable(el,null);
  else {
    el.style.cursor='pointer';
    el.oncontextmenu=e=>{e.preventDefault();e.stopPropagation(); /* cores no zoom */};
  }
  b.appendChild(el);return el;
}

function createCardPiece(b,card,x,y,pid,opts){
  opts=opts||{};
  const id=pid||('k'+pieceSeq++);
  const el=document.createElement('div');
  el.className='piece card';
  el.dataset.type='card';el.dataset.pid=id;el.dataset.uid=card.uid;
  if(opts.pctPos){ el.dataset.px=String(opts.pctPos.px); el.dataset.py=String(opts.pctPos.py); applyPosPct(el); }
  else setPosPct(el,b,x,y);
  el.innerHTML='<img src="'+(card.image||ph(card.name))+'" onerror="this.src=\''+ph(card.name)+'\'">';
  el._cardData=card;
  bumpZ(el);
  const fat = opts.fatigue!=null ? opts.fatigue : (opts.exhausted ? 1 : 0);
  setCardFatigue(el, fat);
  if(b===board){
    makeDraggable(el,card);
  } else {
    el.style.cursor='pointer';
    el.oncontextmenu=e=>{
      e.preventDefault();e.stopPropagation();
      if(isTouchDerivedEvent(e)) return;
      showZoom(card, {fromField:true, event:e});
    };
  }
  b.appendChild(el);return el;
}

function setCardFatigue(el, level){
  level = parseInt(level,10)||0;
  if(level<0) level=0;
  if(level>2) level=2;
  el.dataset.fatigue = String(level);
  el.classList.remove('fatigue-1','fatigue-2','exhausted');
  if(level===1) el.classList.add('fatigue-1','exhausted');
  if(level===2) el.classList.add('fatigue-2');
  if(typeof raiseAllCores==='function') raiseAllCores();
}
function getCardFatigue(el){
  return parseInt(el.dataset.fatigue||'0',10)||0;
}
function cycleCardFatigue(el){
  // 一般點擊：0 ↔ 1（疲勞）；重疲勞用工具模式設為 2
  const cur=getCardFatigue(el);
  setCardFatigue(el, cur===1 ? 0 : 1);
  raiseAllCores();
}

function makeDraggable(el,cardData){
  let sx,sy,ox,oy,dragging=false,timer=null,groupStart=null,posReady=false;
  el.addEventListener('mousedown',e=>{
    if(e.button!==0)return;
    if(el._skipMouseUntil && Date.now()<el._skipMouseUntil) return;
    e.stopPropagation();
    sx=e.clientX; sy=e.clientY;
    el._justDragged=false;
    posReady=false;
    groupStart=null;
    bumpZ(el);

    if(el.dataset.type==='core' && selectedCores.has(el)){
      // group prepared when drag actually starts
    } else if(el.dataset.type==='core'){
      clearCoreSelection();
    }


    function beginPixelDrag(){
      if(posReady) return;
      posReady=true;
      const br=board.getBoundingClientRect();
      // Use stored % center-stable layout position, not AABB after rotate
      if(el.dataset.px!=null){
        ox = parseFloat(el.dataset.px)/100 * br.width;
        oy = parseFloat(el.dataset.py)/100 * br.height;
      } else {
        // fallback unrotated offsetTop/Left relative to board
        ox = el.offsetLeft;
        oy = el.offsetTop;
      }
      el.style.left = ox+'px';
      el.style.top = oy+'px';

      if(el.dataset.type==='core' && selectedCores.has(el)){
        groupStart=new Map();
        selectedCores.forEach(c=>{
          let px,py;
          if(c.dataset.px!=null){
            px=parseFloat(c.dataset.px)/100*br.width;
            py=parseFloat(c.dataset.py)/100*br.height;
          } else {
            px=c.offsetLeft; py=c.offsetTop;
          }
          c.style.left=px+'px'; c.style.top=py+'px';
          groupStart.set(c,{x:px,y:py});
          bumpZ(c);
        });
      }
    }

    timer=setTimeout(()=>{
      dragging=true; el.classList.add('dragging');
      beginPixelDrag();
    },90);

    const onMove=ev=>{
      if(!dragging){
        if(Math.abs(ev.clientX-sx)>5||Math.abs(ev.clientY-sy)>5){
          clearTimeout(timer);
          dragging=true; el.classList.add('dragging');
          beginPixelDrag();
        }
        return;
      }
      el._justDragged=true;
      const dx=ev.clientX-sx, dy=ev.clientY-sy;
      if(groupStart && groupStart.size>1){
        groupStart.forEach((pos,c)=>{
          c.style.left=(pos.x+dx)+'px';
          c.style.top=(pos.y+dy)+'px';
        });
      } else {
        el.style.left=(ox+dx)+'px';
        el.style.top=(oy+dy)+'px';
      }
      const hd=document.getElementById('handDrop');
      const hr=document.getElementById('handBarSelf').getBoundingClientRect();
      if(ev.clientX>=hr.left&&ev.clientX<=hr.right&&ev.clientY>=hr.top&&ev.clientY<=hr.bottom)
        hd.classList.add('active'); else hd.classList.remove('active');
    };

    const onUp=ev=>{
      clearTimeout(timer);
      document.removeEventListener('mousemove',onMove);
      document.removeEventListener('mouseup',onUp);
      el.classList.remove('dragging');
      document.getElementById('handDrop').classList.remove('active');

      function commitPct(node){
        if(!node || !node.isConnected) return;
        const leftPx=parseFloat(node.style.left)||0;
        const topPx=parseFloat(node.style.top)||0;
        setPosPct(node, board, leftPx, topPx);
      }

      if(dragging){
        pushHistory();
        const hr=document.getElementById('handBarSelf').getBoundingClientRect();
        const inHand=ev.clientX>=hr.left&&ev.clientX<=hr.right&&ev.clientY>=hr.top&&ev.clientY<=hr.bottom;
        if(inHand){
          if(el.dataset.type==='core'){
            if(groupStart && groupStart.size>1){
              const n=groupStart.size;
              groupStart.forEach((_,c)=>{c.remove(); selectedCores.delete(c);});
              toast('已刪除 '+n+' 顆 Core');
            } else {
              el.remove(); selectedCores.delete(el); toast('已刪除 Core');
            }
            broadcastState();
          } else if(cardData){
            me.field=me.field.filter(c=>c.uid!==cardData.uid);
            me.trash=me.trash.filter(c=>c.uid!==cardData.uid);
            if(!me.hand.find(c=>c.uid===cardData.uid)) me.hand.push(cardData);
            el.remove(); renderHand(); toast('加入手牌'); broadcastState();
          }
        } else if(cardData && el.dataset.type==='card'){
          const deckZ=document.getElementById('zh-deck').getBoundingClientRect();
          if(ev.clientX>=deckZ.left&&ev.clientX<=deckZ.right&&ev.clientY>=deckZ.top&&ev.clientY<=deckZ.bottom){
            me.deckCards.push(cardData);
            me.field=me.field.filter(c=>c.uid!==cardData.uid);
            me.trash=me.trash.filter(c=>c.uid!==cardData.uid);
            el.remove(); renderDeckStack(); updateMeta(); renderTracker(); toast('放到牌底'); broadcastState();
          } else {
            commitPct(el); broadcastState();
          }
        } else {
          if(groupStart && groupStart.size>1) groupStart.forEach((_,c)=>commitPct(c));
          else commitPct(el);
          broadcastState();
        }
      } else {
        // pure click
        if(el.dataset.type==='card'){
          if(toolMode==='inspect'){
            if(cardData) showZoom(cardData, {fromField:true, event:ev});
            clearToolMode();
            return;
          }
          if(toolMode==='void'){
            pushHistory();
            voidCardFromField(el, cardData);
            clearToolMode();
            return;
          }
          if(toolMode==='refatigue'){
            pushHistory();
            setCardFatigue(el, 2);
            broadcastState();
            toast('重疲勞');
            clearToolMode();
            return;
          }
          pushHistory();
          cycleCardFatigue(el);
          broadcastState();
        }
      }
      setTimeout(()=>{el._justDragged=false;},40);
      dragging=false; groupStart=null;
    };
    document.addEventListener('mousemove',onMove);
    document.addEventListener('mouseup',onUp);
  });
  if(cardData){
    el.addEventListener('contextmenu', e=>{
      e.preventDefault(); e.stopPropagation();
      // 場上卡：觸控長按不開放大，僅滑鼠右鍵
      if(isTouchDerivedEvent(e)) return;
      showZoom(cardData, {fromField:true, event:e});
    });
  }
}

// ===== Box select cores =====
let selectedCores = new Set();
let boxSelecting = false;
let boxStart = null;

function clearCoreSelection(){
  selectedCores.forEach(el => el.classList.remove('selected'));
  selectedCores.clear();
}
function selectCoresInRect(x1,y1,x2,y2){
  clearCoreSelection();
  const left=Math.min(x1,x2), right=Math.max(x1,x2);
  const top=Math.min(y1,y2), bottom=Math.max(y1,y2);
  const br = board.getBoundingClientRect();
  board.querySelectorAll('.piece.core').forEach(el=>{
    const r = el.getBoundingClientRect();
    const cx = r.left - br.left + r.width/2;
    const cy = r.top - br.top + r.height/2;
    if(cx>=left && cx<=right && cy>=top && cy<=bottom){
      selectedCores.add(el);
      el.classList.add('selected');
    }
  });
}

board.addEventListener('mousedown', function(e){
  if(e.button!==0) return;
  if(e.target.closest('.piece') || e.target.closest('.deck-stack')) return;
  boxSelecting = true;
  const br = board.getBoundingClientRect();
  boxStart = {x: e.clientX - br.left, y: e.clientY - br.top};
  const sb = document.getElementById('selBox');
  if(!sb) return;
  sb.style.display = 'block';
  sb.style.left = boxStart.x+'px';
  sb.style.top = boxStart.y+'px';
  sb.style.width = '0px';
  sb.style.height = '0px';

  const onMove = ev => {
    if(!boxSelecting) return;
    const br2 = board.getBoundingClientRect();
    const cx = ev.clientX - br2.left, cy = ev.clientY - br2.top;
    const l = Math.min(boxStart.x, cx), tp = Math.min(boxStart.y, cy);
    const w = Math.abs(cx - boxStart.x), h = Math.abs(cy - boxStart.y);
    sb.style.left = l+'px'; sb.style.top = tp+'px';
    sb.style.width = w+'px'; sb.style.height = h+'px';
  };
  const onUp = ev => {
    if(!boxSelecting) return;
    boxSelecting = false;
    const br2 = board.getBoundingClientRect();
    const cx = ev.clientX - br2.left, cy = ev.clientY - br2.top;
    const w = Math.abs(cx - boxStart.x), h = Math.abs(cy - boxStart.y);
    sb.style.display = 'none';
    if(w > 6 || h > 6){
      selectCoresInRect(boxStart.x, boxStart.y, cx, cy);
      if(selectedCores.size) toast('已選取 '+selectedCores.size+' 顆 Core');
    } else {
      clearCoreSelection();
    }
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
  };
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
});

function serializePublic(){
  const pieces=[];
  board.querySelectorAll('.piece').forEach(el=>{
    if(el.dataset.px==null){
      const w=board.clientWidth||1,h=board.clientHeight||1;
      const lx=parseFloat(el.style.left)||0, ly=parseFloat(el.style.top)||0;
      if(String(el.style.left).endsWith('%')){
        el.dataset.px=String(parseFloat(el.style.left));
        el.dataset.py=String(parseFloat(el.style.top));
      } else {
        el.dataset.px=String((lx/w)*100);
        el.dataset.py=String((ly/h)*100);
      }
    }
    pieces.push({
      pid:el.dataset.pid,type:el.dataset.type,color:el.dataset.color||null,
      uid:el.dataset.uid||null,cardId:el._cardData?el._cardData.id:null,
      px:parseFloat(el.dataset.px),py:parseFloat(el.dataset.py),
      z:parseInt(el.style.zIndex)||20,
      fatigue:getCardFatigue(el),exhausted:getCardFatigue(el)>=1
    });
  });
  return {from:clientId,ts:Date.now(),deckCount:me.deckCards.length,handCount:me.hand.length,pieces};
}

function renderOppState(st){
  if(!st||st.from===clientId)return;
  boardOpp.querySelectorAll('.piece,.deck-stack').forEach(el=>el.remove());
  const pos=pct(boardOpp,80.6,9.5);
  const stack=document.createElement('div');
  stack.className='deck-stack';
  stack.style.backgroundImage='url('+CARD_BACK+')';
  stack.textContent=st.deckCount||0;
  setPosPct(stack, boardOpp, pos.x, pos.y);
  stack.style.pointerEvents='none';
  boardOpp.appendChild(stack);
  (st.pieces||[]).forEach(p=>{
    let pctPos = null;
    if(p.px!=null && p.py!=null) pctPos = {px:p.px, py:p.py};
    else if(p.left!=null){
      const lx=parseFloat(p.left)||0, ly=parseFloat(p.top)||0;
      if(String(p.left).endsWith('%')) pctPos = {px:lx, py:ly};
      else {
        const w=boardOpp.clientWidth||1, h=boardOpp.clientHeight||1;
        pctPos = {px:(lx/w)*100, py:(ly/h)*100};
      }
    }
    if(p.type==='core'){
      const el=createCore(boardOpp,p.color||'blue',0,0,p.pid,pctPos);
      if(p.z) el.style.zIndex=String(p.z);
    } else if(p.type==='card'&&p.cardId){
      const base=cardById.get(p.cardId);if(!base)return;
      const card=Object.assign({},base,{uid:p.uid});
      const el=createCardPiece(boardOpp,card,0,0,p.pid,{fatigue:p.fatigue!=null?p.fatigue:(p.exhausted?1:0),pctPos:pctPos});
      if(p.z) el.style.zIndex=String(p.z);
    }
  });
  const area=document.getElementById('handAreaOpp');area.innerHTML='';
  const n=Math.max(0, st.handCount|0);
  document.getElementById('oppMeta').textContent='已連線 · 手牌 '+n+' · 牌組 '+(st.deckCount||0);
  const cntEl=document.getElementById('oppHandCount');
  if(cntEl){
    cntEl.textContent = n + ' 張';
    cntEl.classList.toggle('empty', n===0);
  }
  // 扇形背面：依區域寬度動態間距，清楚呈現剩餘張數
  const show = Math.min(n, 16);
  if(show<=0) return;
  const areaW = area.clientWidth || (area.parentElement && area.parentElement.clientWidth) || 280;
  const cardW = 42;
  const pad = 8;
  const maxSpan = Math.max(0, areaW - cardW - pad * 2);
  const idealGap = 30;
  let totalSpan = show <= 1 ? 0 : (show - 1) * idealGap;
  if(totalSpan > maxSpan) totalSpan = maxSpan;
  const spread = show <= 1 ? 0 : totalSpan / (show - 1);
  const startX = -totalSpan / 2;
  const maxRot = Math.min(8, 2 + show * 0.35);
  for(let i=0;i<show;i++){
    const el=document.createElement('div');el.className='hand-card back';
    const t = show === 1 ? 0 : (i / (show - 1)) * 2 - 1;
    const offset = startX + i * spread;
    el.style.bottom='6px';
    el.style.width=cardW+'px';
    el.style.height='58px';
    el.style.left='calc(50% + '+offset+'px - '+(cardW/2)+'px)';
    el.style.transform='rotate('+(t*maxRot)+'deg)';
    el.style.zIndex=String(5+i);
    area.appendChild(el);
  }
}

let wsWantRoom = null;
let wsRetryTimer = null;
let wsHeartbeat = null;

function stopWsHeartbeat(){
  if(wsHeartbeat){ clearInterval(wsHeartbeat); wsHeartbeat=null; }
}
function startWsHeartbeat(){
  stopWsHeartbeat();
  wsHeartbeat = setInterval(()=>{
    if(!roomChannel) return;
    try{
      roomChannel.send({type:'broadcast',event:'ping',payload:{from:clientId,ts:Date.now()}});
    }catch(e){}
  }, 15000);
}

async function createRoom(){
  const code=Math.random().toString(36).slice(2,6).toUpperCase();
  await joinRoom(code,true);
}

async function joinRoom(code,isCreator){
  const client=ensureSb(); if(!client) return;
  leaveRoom(false);
  roomCode=(code||'').trim().toUpperCase();
  if(!roomCode){ toast('請輸入代碼'); return; }
  wsWantRoom = { code: roomCode, isCreator: !!isCreator };
  setWsStatus('pending', '連線中…');

  roomChannel = client.channel('bs-ws-'+roomCode, {
    config: { broadcast: { self: false, ack: false } }
  });

  roomChannel.on('broadcast', { event: 'pub' }, ({payload})=>{
    applyingRemote=true;
    try{ renderOppState(payload); } finally { applyingRemote=false; }
  });
  roomChannel.on('broadcast', { event: 'hello' }, ({payload})=>{
    if(payload && payload.from!==clientId){
      toast('對手已連線');
      broadcastState();
    }
  });
  roomChannel.on('broadcast', { event: 'coin' }, ({payload})=>{
    if(!payload || payload.from===clientId) return;
    const result = payload.result || (payload.heads ? '正面' : '反面');
    toast('對手擲硬幣：'+result, 5000);
  });
  roomChannel.on('broadcast', { event: 'ping' }, ()=>{ /* heartbeat */ });

  const sub = await roomChannel.subscribe((status)=>{
    console.log('ws status', status);
    if(status==='SUBSCRIBED'){
      setWsStatus('on', '已連線 · '+roomCode+(isCreator?'（房主）':''));
      startWsHeartbeat();
      try{
        roomChannel.send({type:'broadcast',event:'hello',payload:{from:clientId}});
      }catch(e){}
      toast('已加入房間 '+roomCode);
      if(isCreator && deckTotal()>0) startNewGame();
      else broadcastState();
    } else if(status==='CHANNEL_ERROR' || status==='TIMED_OUT'){
      setWsStatus('off', '連線錯誤，重試中…');
      scheduleWsRetry();
    } else if(status==='CLOSED'){
      setWsStatus('off', '已斷線');
      scheduleWsRetry();
    }
  });
}

function scheduleWsRetry(){
  if(!wsWantRoom) return;
  if(wsRetryTimer) clearTimeout(wsRetryTimer);
  wsRetryTimer = setTimeout(()=>{
    if(!wsWantRoom) return;
    toast('重新連線…');
    joinRoom(wsWantRoom.code, wsWantRoom.isCreator);
  }, 2500);
}

function leaveRoom(clearWant){
  if(clearWant!==false) wsWantRoom = null;
  if(wsRetryTimer){ clearTimeout(wsRetryTimer); wsRetryTimer=null; }
  stopWsHeartbeat();
  if(roomChannel){
    try{ roomChannel.unsubscribe(); }catch(e){}
    roomChannel=null;
  }
  roomCode=null;
  setWsStatus('off', '');
  document.getElementById('oppMeta').textContent='未連線 · 手牌 ? · 牌組 ?';
  boardOpp.querySelectorAll('.piece,.deck-stack').forEach(el=>el.remove());
  const hopp=document.getElementById('handAreaOpp');
  if(hopp) hopp.innerHTML='';

  if(cntEl){ cntEl.textContent='—'; cntEl.classList.add('empty'); }
}

  board.querySelectorAll('.deck-stack').forEach(el=>applyPosPct(el));
  if(boardOpp){
    boardOpp.querySelectorAll('.piece').forEach(el=>applyPosPct(el));
    boardOpp.querySelectorAll('.deck-stack').forEach(el=>applyPosPct(el));
  }
  // 視窗寬度變化時重算手牌扇形，避免超出邊界
  clearTimeout(_handResizeTimer);
  _handResizeTimer=setTimeout(()=>{ if(me && me.hand && me.hand.length) renderHand(); }, 80);

function renderTracker(){
  const list = document.getElementById('trackerList');
  if(!list) return;
  if(!deckComposition || !Object.keys(deckComposition).length){
    list.innerHTML = '<div class="tracker-empty">開始遊戲後顯示</div>';
    return;
  }
  // remaining in deck
  const remain = new Map();
  (me.deckCards||[]).forEach(c=>{
    remain.set(c.id, (remain.get(c.id)||0)+1);
  });
  function typeRank(t){
    const s=String(t||'');
    if(s.includes('戰魂')) return 0;
    if(s.includes('核心')) return 1;
    if(s.includes('魔法')) return 2;
    return 3;
  }
  const rows = Object.keys(deckComposition).map(id=>{
    const base = cardById.get(id) || (me.deckCards||[]).find(c=>c.id===id) || {id, name:id, image:'', cost:0, type:''};
    const card = base.name ? base : {id, name:String(id).slice(0,8), image:'', cost:0, type:''};
    return {card, qty: remain.get(id)||0, start: deckComposition[id]||0};
  }).sort((a,b)=>{
    // 1) 戰魂 > 核心 > 魔法  2) 同種類費用小→大
    const ta = typeRank(a.card.type), tb = typeRank(b.card.type);
    if(ta!==tb) return ta-tb;
    const ca = Number(a.card.cost)||0, cb = Number(b.card.cost)||0;
    if(ca!==cb) return ca-cb;
    return (a.card.name||'').localeCompare(b.card.name||'', 'zh');
  });
  list.innerHTML = '';
  rows.forEach(({card, qty})=>{
    const el = document.createElement('div');
    el.className = 'tracker-item';
    el.innerHTML = '<img src="'+(card.image||ph(card.name))+'" onerror="this.style.opacity=.3"><div class="tname">'+card.name+'</div><span class="tqty'+(qty===0?' zero':'')+'">' + qty + '</span>';
    el.oncontextmenu = e=>{ e.preventDefault(); showZoom(card); };
    list.appendChild(el);
  });
}


document.addEventListener('selectstart', e=>{
  if(e.target.closest && (e.target.closest('.board') || e.target.closest('.hand-bar') || e.target.closest('.piece') || e.target.closest('.hand-card'))){
    e.preventDefault();
  }
});


// ===== Mobile touch controls (PC mouse path unchanged) =====
(function setupMobileTouch(){
  const LONG_MS = 380;
  let touchCoreSet = new Set(); // multi-select cores for two-tap move

  function isCoarse(){
    try{ return window.matchMedia('(hover:none) and (pointer:coarse)').matches; }catch(e){ return false; }
  }

  function boardLocal(clientX, clientY){
    const br = board.getBoundingClientRect();
    return { x: clientX - br.left, y: clientY - br.top, br };
  }

  function clearTouchCoreSel(){
    board.querySelectorAll('.piece.core.touch-sel').forEach(el=>el.classList.remove('touch-sel'));
    touchCoreSet.clear();
  }

  function toggleTouchCore(el){
    if(touchCoreSet.has(el)){
      touchCoreSet.delete(el);
      el.classList.remove('touch-sel');
    } else {
      touchCoreSet.add(el);
      el.classList.add('touch-sel');
    }
  }

  function moveCoresTo(clientX, clientY){
    if(!touchCoreSet.size) return;
    const {x,y,br} = boardLocal(clientX, clientY);
    const list = [...touchCoreSet].filter(el=>el.isConnected);
    if(!list.length){ clearTouchCoreSel(); return; }
    // Keep relative offsets between cores; anchor first core to tap point
    const br0 = list[0].getBoundingClientRect();
    const anchorX = br0.left - br.left + br0.width/2;
    const anchorY = br0.top - br.top + br0.height/2;
    const dx = x - anchorX, dy = y - anchorY;
    list.forEach(el=>{
      let ox, oy;
      if(el.dataset.px!=null){
        ox = parseFloat(el.dataset.px)/100*br.width;
        oy = parseFloat(el.dataset.py)/100*br.height;
      } else {
        ox = el.offsetLeft; oy = el.offsetTop;
      }
      setPosPct(el, board, ox+dx, oy+dy);
      bumpZ(el);
    });
    clearTouchCoreSel();
    broadcastState();
  }

  // --- Pieces: long-press drag; core short-tap multi-select ---
  board.addEventListener('touchstart', function(e){
    const core = e.target.closest && e.target.closest('.piece.core');
    const card = e.target.closest && e.target.closest('.piece.card');
    if(!core && !card) return;
    if(e.touches.length!==1) return;

    const t0 = e.touches[0];
    const startX = t0.clientX, startY = t0.clientY;
    let moved = false, dragging = false, longTimer = null, longFired = false;
    const target = core || card;
    const isCore = !!core;

    longTimer = setTimeout(()=>{
      longFired = true;
      dragging = true;
      const br = board.getBoundingClientRect();
      let ox, oy;
      if(target.dataset.px!=null){
        ox = parseFloat(target.dataset.px)/100*br.width;
        oy = parseFloat(target.dataset.py)/100*br.height;
      } else {
        ox = target.offsetLeft; oy = target.offsetTop;
      }
      target.style.left = ox+'px';
      target.style.top = oy+'px';
      target.classList.add('dragging');
      bumpZ(target);
      target._touchOx = ox; target._touchOy = oy;
      target._touchSX = startX; target._touchSY = startY;
      if(navigator.vibrate) try{ navigator.vibrate(12); }catch(err){}
    }, LONG_MS);

    const onMove = (ev)=>{
      const t1 = ev.touches[0];
      const dx = t1.clientX - startX, dy = t1.clientY - startY;
      if(!moved && (Math.abs(dx)>10 || Math.abs(dy)>10)){
        moved = true;
        if(longTimer){ clearTimeout(longTimer); longTimer=null; }
      }
      if(dragging){
        ev.preventDefault();
        target.style.left = (target._touchOx + (t1.clientX - target._touchSX))+'px';
        target.style.top = (target._touchOy + (t1.clientY - target._touchSY))+'px';
      }
    };

    const onEnd = (ev)=>{
      if(longTimer){ clearTimeout(longTimer); longTimer=null; }
      document.removeEventListener('touchmove', onMove);
      document.removeEventListener('touchend', onEnd);
      document.removeEventListener('touchcancel', onEnd);
      target.classList.remove('dragging');
      target._skipMouseUntil = Date.now()+600;

      if(dragging){
        pushHistory();
        const touch = (ev.changedTouches && ev.changedTouches[0]) || null;
        if(touch){
          const hr = document.getElementById('handBarSelf').getBoundingClientRect();
          const inHand = touch.clientX>=hr.left && touch.clientX<=hr.right && touch.clientY>=hr.top && touch.clientY<=hr.bottom;
          if(inHand && isCore){
            target.remove();
            toast('已刪除 Core');
            clearTouchCoreSel();
            broadcastState();
            return;
          }
          if(inHand && !isCore && target._cardData){
            const cardData = target._cardData;
            me.field = me.field.filter(c=>c.uid!==cardData.uid);
            me.trash = me.trash.filter(c=>c.uid!==cardData.uid);
            if(!me.hand.find(c=>c.uid===cardData.uid)) me.hand.push(cardData);
            target.remove(); renderHand(); toast('加入手牌'); broadcastState();
            return;
          }
          // 拖到牌堆區 → 放到牌底（手機端對應電腦 makeDraggable 行為）
          if(!isCore && target._cardData){
            const deckZ = document.getElementById('zh-deck').getBoundingClientRect();
            if(touch.clientX>=deckZ.left && touch.clientX<=deckZ.right && touch.clientY>=deckZ.top && touch.clientY<=deckZ.bottom){
              const cardData = target._cardData;
              me.deckCards.push(cardData);
              me.field = me.field.filter(c=>c.uid!==cardData.uid);
              me.trash = me.trash.filter(c=>c.uid!==cardData.uid);
              target.remove();
              renderDeckStack(); updateMeta(); renderTracker();
              toast('放到牌底'); broadcastState();
              return;
            }
          }
        }
        setPosPct(target, board, parseFloat(target.style.left)||0, parseFloat(target.style.top)||0);
        broadcastState();
        return;
      }

      // short tap
      if(!moved && !longFired){
        if(isCore){
          target._skipMouseUntil = Date.now()+600;
          toggleTouchCore(target);
          const n = touchCoreSet.size;
          if(n) toast('已選 '+n+' 顆 Core，點盤面或卡牌移動');
          else toast('已取消選取');
          ev.preventDefault();
        } else {
          target._skipMouseUntil = Date.now()+600;
          // If cores selected, tapping a card moves cores onto the card
          if(touchCoreSet.size){
            const touch = (ev.changedTouches && ev.changedTouches[0]) || null;
            if(touch){
              pushHistory();
              moveCoresTo(touch.clientX, touch.clientY);
              toast('Core 已移動到卡上');
              ev.preventDefault();
            }
          } else {
            // 輕觸場上卡
            if(toolMode==='inspect'){
              if(target._cardData) showZoom(target._cardData);
              clearToolMode();
              ev.preventDefault();
            } else if(toolMode==='void'){
              pushHistory();
              voidCardFromField(target, target._cardData);
              clearToolMode();
              ev.preventDefault();
            } else if(toolMode==='refatigue'){
              pushHistory();
              setCardFatigue(target, 2);
              broadcastState();
              toast('重疲勞');
              clearToolMode();
              ev.preventDefault();
            } else {
              pushHistory();
              cycleCardFatigue(target);
              broadcastState();
              ev.preventDefault();
            }
          }
        }
      }
    };

    document.addEventListener('touchmove', onMove, {passive:false});
    document.addEventListener('touchend', onEnd);
    document.addEventListener('touchcancel', onEnd);
  }, {passive:true});

  // Tap empty board (or non-core) to move selected cores
  board.addEventListener('touchstart', function(e){
    if(!touchCoreSet.size) return;
    // if starting on a core, the other handler manages toggle
    if(e.target.closest && e.target.closest('.piece.core')) return;
    if(e.touches.length!==1) return;
    const t0 = e.touches[0];
    const startX = t0.clientX, startY = t0.clientY;
    let moved=false;
    const onMove = (ev)=>{
      const t1=ev.touches[0];
      if(Math.abs(t1.clientX-startX)>12||Math.abs(t1.clientY-startY)>12) moved=true;
    };
    const onEnd = (ev)=>{
      document.removeEventListener('touchmove', onMove);
      document.removeEventListener('touchend', onEnd);
      if(moved) return;
      const touch = ev.changedTouches[0];
      // allow destination on empty OR on card
      pushHistory();
      moveCoresTo(touch.clientX, touch.clientY);
      toast('Core 已移動');
    };
    document.addEventListener('touchmove', onMove, {passive:true});
    document.addEventListener('touchend', onEnd);
  }, {passive:true});

  // Tracker long-press → zoom
  const tracker = document.getElementById('trackerList');
  if(tracker){
    tracker.addEventListener('touchstart', function(e){
      const item = e.target.closest && e.target.closest('.tracker-item');
      if(!item) return;
      const startX = e.touches[0].clientX, startY = e.touches[0].clientY;
      let moved=false;
      const timer = setTimeout(()=>{
        if(moved) return;
        const nameEl = item.querySelector('.tname');
        const nm = nameEl ? nameEl.textContent : '';
        const card = ALL_CARDS.find(c=>c.name===nm);
        if(card) showZoom(card);
        if(navigator.vibrate) try{ navigator.vibrate(12); }catch(err){}
      }, 450);
      const onMove = (ev)=>{
        if(Math.abs(ev.touches[0].clientX-startX)>10||Math.abs(ev.touches[0].clientY-startY)>10){
          moved=true; clearTimeout(timer);
        }
      };
      const onEnd = ()=>{
        clearTimeout(timer);
        document.removeEventListener('touchmove', onMove);
        document.removeEventListener('touchend', onEnd);
      };
      document.addEventListener('touchmove', onMove, {passive:true});
      document.addEventListener('touchend', onEnd);
    }, {passive:true});
  }

  // Hand long-press → zoom
  const handArea = document.getElementById('handArea');
  if(handArea){
    handArea.addEventListener('touchstart', function(e){
      const hc = e.target.closest && e.target.closest('.hand-card');
      if(!hc) return;
      const startX = e.touches[0].clientX, startY = e.touches[0].clientY;
      let moved=false;
      const timer = setTimeout(()=>{
        if(moved) return;
        const uid = hc.dataset.uid;
        const card = me.hand.find(c=>c.uid===uid);
        if(card) showZoom(card);
        if(navigator.vibrate) try{ navigator.vibrate(12); }catch(err){}
      }, 450);
      const onMove = (ev)=>{
        if(Math.abs(ev.touches[0].clientX-startX)>10||Math.abs(ev.touches[0].clientY-startY)>10){
          moved=true; clearTimeout(timer);
        }
      };
      const onEnd = ()=>{
        clearTimeout(timer);
        document.removeEventListener('touchmove', onMove);
        document.removeEventListener('touchend', onEnd);
      };
      document.addEventListener('touchmove', onMove, {passive:true});
      document.addEventListener('touchend', onEnd);
    }, {passive:true});
  }

  // Block browser context menu on field pieces for mobile (no zoom)
  board.addEventListener('contextmenu', function(e){
    if(e.target.closest && e.target.closest('.piece')){
      // 場上物件：觸控一律不彈選單／不放大
      if(isTouchDerivedEvent(e)){
        e.preventDefault();
        e.stopPropagation();
      }
    }
  }, true);

  // 阻止 iOS 長按圖片預覽
  board.addEventListener('selectstart', e=>{ if(e.target.closest && e.target.closest('.piece')) e.preventDefault(); });
})();


loadCards();
</script>
